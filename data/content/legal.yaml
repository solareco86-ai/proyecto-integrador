terms:
  title: "Términos y Condiciones Institucionales"
  last_updated: "2026-09-03"
  introduction: "Estos términos y condiciones regulan el uso del portal web institucional isftn199.com.ar (en adelante, \"el Sitio\"), perteneciente al Instituto Superior de Formación Técnica N° 199 de Tigre (DGCyE, Provincia de Buenos Aires). Al navegar por el Sitio, aceptás estos términos."
  sections:
    - title: "1. Información institucional y académica"
      paragraphs:
        - "El ISFT N° 199 es una institución educativa pública estatal dependiente de la Dirección General de Cultura y Educación (DGCyE) de la Provincia de Buenos Aires, en el marco de la Dirección de Educación Técnico Profesional."
        - "Toda la información referente a carreras, tecnicaturas superiores, resoluciones, correlatividades, fechas de inscripción y calendario académico tiene carácter orientativo y se encuentra sujeta a las disposiciones normativas emitidas por las autoridades educativas provinciales."
    - title: "2. Uso del sitio y campus virtual"
      paragraphs:
        - "El usuario se compromete a utilizar el portal y el campus virtual con fines pedagógicos, informativos y de vinculación comunitaria, respetando las normas de convivencia académica y la legislación vigente."
    - title: "3. Formularios de consulta y datos personales"
      paragraphs:
        - "Los datos provistos en los formularios de consulta, preinscripción o contacto son tratados con estricta confidencialidad y utilizados únicamente para gestiones académicas e informativas del instituto."
    - title: "4. Propiedad intelectual y recursos educativos abiertos"
      paragraphs:
        - "Los materiales de estudio, guías pedagógicas y recursos de código abiertos compartidos en el campus virtual se distribuyen para fines educativos de los estudiantes y la comunidad técnica."
    - title: "5. Contacto y secretaría"
      paragraphs:
        - "Para consultas institucionales o académicas, podés escribir a isft199@gmail.com o comunicarte telefónicamente al 11 4736-0013."
