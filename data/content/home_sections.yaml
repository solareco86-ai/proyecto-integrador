faq:
  eyebrow: Ayuda e Ingreso
  title: Preguntas frecuentes sobre la cursada
  questions:
  - question: ¿Las carreras tienen costo de arancel o matrícula?
    answer: No. El ISFT N° 199 es una institución de educación pública y estatal dependiente
      de la DGCyE de la Provincia de Buenos Aires. Todas las tecnicaturas son 100%
      gratuitas.
  - question: ¿Cuáles son los requisitos de inscripción?
    answer: Tener secundario completo (o constancia de título en trámite), fotocopia
      de DNI, partida de nacimiento, planilla de inscripción y certificado de aptitud
      psicofísica.
  - question: ¿Los títulos otorgados son oficiales?
    answer: Sí, todos los títulos tienen validez nacional oficial bajo resoluciones
      de la Dirección General de Cultura y Educación.
  - question: ¿En qué horario se cursa?
    answer: El horario de cursada es vespertino, de lunes a viernes de 18:00 a 22:30
      hs, diseñado especialmente para compatibilizar trabajo y estudio.
  - question: ¿Dónde queda el instituto y cómo llegar?
    answer: La sede está ubicada en Maestra Celina Voena 1750, El Talar, Tigre. Cuenta
      con acceso rápido desde Panamericana y múltiples líneas de colectivos.
  - question: ¿Puedo articular con universidades?
    answer: Sí. Al ser títulos oficiales de nivel superior técnico, permiten ingresar
      a Ciclos de Complementación Curricular en universidades nacionales para obtener
      licenciaturas e ingenierías.
about:
  title: Sobre el ISFT N° 199
  paragraphs:
  - El Instituto Superior de Formación Técnica N° 199 de Tigre es una institución
    pública y gratuita orientada a la formación de profesionales técnicos calificados
    con fuerte compromiso social y productivo.
  - Nuestra oferta educativa en Ciencia de Datos e IA, Mecatrónica, Logística, Higiene
    y Seguridad, Recursos Humanos y Turismo busca potenciar las oportunidades laborales
    de la comunidad de Tigre y Zona Norte.
