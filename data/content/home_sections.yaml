services:
  eyebrow: Áreas Formativas y Tecnicaturas
  title: Propuesta académica orientada al desarrollo tecnológico y profesional
  description: Siete tecnicaturas superiores diseñadas para responder a la transformación
    digital, la automatización industrial, la logística regional y la gestión organizacional.
  cards:
  - id: ciencia-de-datos-ia
    title: Tecnicatura Superior en Ciencia de Datos e IA
    description: Formación especializada en programación Python, algoritmos de Machine
      Learning, Deep Learning, SQL, Big Data y desarrollo de APIs inteligentes.
    problem: ¿Querés insertarte en el sector tecnológico más demandado aprendiendo
      a transformar datos en decisiones e inteligencia artificial?
    key_points:
    - Python para datos, visualización y análisis exploratorio
    - Machine Learning, redes neuronales y visión artificial
    - Despliegue de modelos y APIs en tiempo real con FastAPI
    proof: Plan de estudios oficial DGCyE con prácticas de código aplicadas a problemas
      reales.
    caso_slug: null
    modality: on_site
    cta: Conocer Carrera
  - id: mecatronica
    title: Tecnicatura Superior en Mecatrónica
    description: Integración de mecánica de precisión, electrónica industrial, microcontroladores,
      PLCs, robótica y sistemas de control automático.
    problem: ¿Buscás dominar el mantenimiento y la automatización de líneas de producción
      industrial y celdas robotizadas?
    key_points:
    - Programación de PLCs y sistemas SCADA industriales
    - Robótica, cinemática y control de servomecanismos
    - Neumática, hidráulica e instrumentación de procesos
    proof: Articulación con laboratorios y prácticas en equipamiento de automatización.
    caso_slug: null
    modality: on_site
    cta: Conocer Carrera
  - id: logistica
    title: Tecnicatura Superior en Logística
    description: Gestión de la cadena de suministro, almacenamiento, ruteo de distribución,
      gestión de stocks y logística multimodal en el Corredor Norte.
    problem: ¿Te interesa planificar y optimizar centros de distribución, transporte
      de cargas y flujos de abastecimiento?
    key_points:
    - Gestión integral de depósitos y almacenes (WMS / ERP)
    - Planificación y ruteo de distribución multimodal
    - Comercio internacional, aduanas y logística sustentable
    proof: Formación con fuerte inserción en los parques industriales de Tigre y alrededores.
    caso_slug: null
    modality: on_site
    cta: Conocer Carrera
  - id: higiene-y-seguridad
    title: Tecnicatura Superior en Higiene y Seguridad
    description: Prevención de riesgos del trabajo, auditoría ambiental laboral, ergonomía
      y planes de seguridad con matrícula profesional habilitante.
    problem: ¿Buscás una profesión con matrícula oficial para resguardar la salud
      de los trabajadores en industrias y obras?
    key_points:
    - Normativas SRT, Ley 19.587 y fiscalización laboral
    - Ergonomía, toxicología y mediciones ambientales
    - Planes de evacuación y protección contra incendios
    proof: Título con matrícula profesional para actuar como responsable de seguridad
      en empresas.
    caso_slug: null
    modality: on_site
    cta: Conocer Carrera
