# Estructura Centralizada de Costos, Tarifas y WBS (Pesos Argentinos - ARS) — DataMaq
# Single Source of Truth (SSOT) para el motor de presupuestación y catálogo comercial 2026.

config:
  currency: "ARS"
  show_public_prices: false  # Control de catálogo web: false = "A cotizar" / true = Precios públicos
  descuentos:
    bapro_pct: 0.10          # 10% OFF para clientes Banco Provincia
    vitrina_pct: 0.15        # 15% OFF por adhesión al programa de Vitrina Pública (Open Telemetry)
    stacking_max_pct: 0.25   # 25% OFF acumulabilidad máxima

# 1. Zonificación de Viáticos en Zona Norte del GBA (Base Garín)
viaticos_zonas:
  garin_escobar:
    nombre: "Garín / Escobar"
    cp_list: ["1619", "1625", "1623"]
    tarifa_ars: 50000
  pilar_parque_industrial:
    nombre: "Pilar / Parque Industrial"
    cp_list: ["1629", "1630", "1631"]
    tarifa_ars: 50000
  tigre_san_fernando:
    nombre: "Tigre / San Fernando"
    cp_list: ["1648", "1646", "1617", "1618"]
    tarifa_ars: 50000
  campana_zarate:
    nombre: "Campana / Zárate"
    cp_list: ["2804", "2800"]
    tarifa_ars: 60000
  san_martin_tres_de_febrero:
    nombre: "San Martín / Tres de Febrero"
    cp_list: ["1650", "1678", "1653"]
    tarifa_ars: 50000
  base_general_gba_norte_ars: 50000
  por_km_adicional_fuera_radio_ars: 1800

# 2. Desglose Modular de Obra en Tablero (WBS de Instalación 5a — 2026)
wbs_subitems:
  a_viaticos_base:
    codigo: "a"
    nombre: "Viáticos y movilidad en planta (Zona Norte GBA)"
    descripcion: "Traslado y logística operativa hasta la fábrica en móvil equipado."
    tarifa_ars: 50000
    es_fijo: true

  b_instalacion_estandar:
    codigo: "b"
    nombre: "Instalación estándar de analizador en riel DIN + 3 TIs"
    descripcion: "Montaje físico, conexionado de transformadores de corriente y cableado de señal cuando el cliente ya garantiza protección y corte seguro aguas abajo (térmica existente)."
    tarifa_ars: 260000
    es_fijo: false

  c_adicional_termica:
    codigo: "c"
    nombre: "Adicional provisión e instalación de térmica dedicada"
    descripcion: "Instalación de interruptor termomagnético tetrapolar/bipolar de maniobra y protección para el instrumento en tablero."
    tarifa_ars: 80000
    es_fijo: false

  d_adicional_acondicionamiento_tablero:
    codigo: "d"
    nombre: "Adicional por acondicionamiento de tablero desprolijo"
    descripcion: "Trabajo previo de ordenamiento, peinado de cables, riel DIN y adecuación de seguridad eléctrica (LOTO) en tableros saturados."
    tarifa_ars: 120000
    es_fijo: false

  e_configuracion_cloud:
    codigo: "e"
    nombre: "Configuración, calibración y enlace cloud de telemetría"
    descripcion: "Parametrización de red, calibración de TIs, mapeo Modbus y verificación de transmisión en vivo a plataforma cloud $0."
    tarifa_ars: 140000
    es_fijo: false

# 3. Visita Preliminar de Relevamiento Técnico e Inspección (Peritaje 2026)
relevamiento_inicial:
  diagnostico_base_ars: 55000
  deducible_100_pct_obra: true
  descripcion: "Peritaje de tableros, factor de potencia y factibilidad técnica. 100% bonificable / deducible de la factura final al aprobar la cotización."

# 4. Tarifas Base de Referencia para Planes Web (cuando show_public_prices = true)
planes_referencia_publica:
  plataforma-cloud:
    precio_base_ars: 0
    modalidad: "gratuito"
  instalacion-hardware:
    # Punto estándar completo: Viáticos ($50k) + Instalación ($260k) + Puesta en Marcha ($140k) = $450.000 ARS
    precio_base_ars: 450000
    modalidad: "punto_llave_en_mano"
  consultoria-energia:
    precio_base_ars: 650000
    modalidad: "servicio_profesional"
  predios-submetering:
    precio_base_ars: 750000
    modalidad: "adecuacion_y_software"

# 5. Escalonamiento Tarifario para Consultoría y Diagnóstico Energético (C-12 — 2026)
consultoria_escalonada:
  t2_pequena_demanda:
    categoria: "T2"
    rango: "10 kW a 50 kW"
    tarifa_base_ars: 350000
    descripcion: "Diagnóstico de potencia y penalidades por factor de potencia cos phi."
  t3_baja_tension:
    categoria: "T3 BT"
    rango: "> 50 kW (Baja Tensión)"
    tarifa_base_ars: 650000
    descripcion: "Auditoría de demanda cuartohoraria, recontratación de potencia y corrección de reactiva."
  t3_media_tension:
    categoria: "T3 MT"
    rango: "Cámara o Transformador Propio (13.2 kV)"
    tarifa_base_ars: 850000
    descripcion: "Auditoría integral de transformador, THD de armónicos e ingeniería de bancos de capacitores."
  bonificacion_acometidas_adicionales_pct: 0.50

# 6. Servicios Remotos, Capacitación y Recurrencia MRR (2026)
servicios_remotos:
  tele_peritaje_documental:
    nombre: "Tele-Peritaje Forense de Facturación (12 meses)"
    tarifa_ars: 150000
    descripcion: "Auditoría asíncrona de 12 facturas de Edenor/Edesur para detección de excesos de potencia y penalidades."
  capacitacion_in_company_virtual:
    nombre: "Capacitación Corporativa In-Company Virtual"
    tarifa_ars: 450000
    descripcion: "Masterclasses por Zoom para departamentos de Mantenimiento sobre normativas eléctricas e integración IoT."
  datamaq_insights_mrr:
    nombre: "DataMaq Insights (MRR Reporte Ejecutivo para CFO)"
    tarifa_min_ars: 85000
    tarifa_max_ars: 150000
    descripcion: "Suscripción mensual de reporte ejecutivo procesado con scripts de Python y Sello de Salud Eléctrica para CFO."

