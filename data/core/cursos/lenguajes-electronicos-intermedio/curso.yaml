id: "lenguajes-electronicos-intermedio"
slug: "lenguajes-electronicos-intermedio"
title: "Lenguajes Electrónicos: Nivel Intermedio"
description_short: "Microcontroladores y el ESP32-WROOM con MicroPython: arquitectura, GPIO, ADC, PWM y pantalla OLED por I2C."
description_long: "Este es el segundo nivel del vertical Lenguajes Electrónicos. Vas a descubrir qué es un microcontrolador, en qué se diferencia de un microprocesador, cómo es su arquitectura interna (procesador, memorias de programa y de datos, oscilador y puertos de E/S) y cómo se manejan las entradas y salidas. Luego pasás a la práctica con la placa ESP32-WROOM: instalación del firmware de MicroPython, uso de la consola REPL, configuración de pines GPIO como salidas (LED) y entradas (pulsadores con resistencias pull-up), lectura de entradas analógicas con el conversor ADC (potenciómetro y LDR), generación de señales PWM para controlar el brillo, y por último la comunicación I2C con una pantalla OLED SSD1306 de 128x64 para dibujar formas y texto. Es un nivel totalmente práctico que sienta las bases del proyecto integrador del nivel avanzado."
duration: "24 horas de cursada"
level: "Intermedio"
language: "Español"
price: 0.0
instructor_id: "agustin-bustos"
academic_only: true
sections:
  # --- SECCIÓN A ---
  - id: "sec-leng-int-a"
    title: "Sección A: El Microcontrolador y el ESP32"
    description: "Conceptos de microcontrolador, arquitectura interna y puesta en marcha del ESP32-WROOM con MicroPython."
    chapters:
      - id: "chap-leng-int-1"
        title: "Cap 1: El Microcontrolador"
        description: "Qué es un microcontrolador, su arquitectura interna, memorias, oscilador y puertos de E/S."
        items:
          - type: "lesson"
            id: "les-leng-int-1-1"
            slug: "microprocesador-vs-microcontrolador"
            title: "1.1 ¿Qué es un microcontrolador? Microprocesador vs microcontrolador"
            duration: "45 min"
            content_file: "cap-1-1-microprocesador-vs-microcontrolador.md"
          - type: "lesson"
            id: "les-leng-int-1-2"
            slug: "arquitectura-interna-microcontrolador"
            title: "1.2 Arquitectura interna, memorias y oscilador"
            duration: "50 min"
            content_file: "cap-1-2-arquitectura-interna-microcontrolador.md"
          - type: "lesson"
            id: "les-leng-int-1-3"
            slug: "puertos-entradas-salidas"
            title: "1.3 Puertos de E/S y periféricos: entradas y salidas"
            duration: "50 min"
            content_file: "cap-1-3-puertos-entradas-salidas.md"

      - id: "chap-leng-int-2"
        title: "Cap 2: Puesta en Marcha del ESP32-WROOM"
        description: "Instalación de MicroPython en la placa, REPL y primeros programas con GPIO: LED y pulsadores."
        items:
          - type: "lesson"
            id: "les-leng-int-2-1"
            slug: "instalacion-micropython-esp32"
            title: "2.1 Instalación de MicroPython en ESP32-WROOM y la consola REPL"
            duration: "50 min"
            content_file: "cap-2-1-instalacion-micropython-esp32.md"
          - type: "lesson"
            id: "les-leng-int-2-2"
            slug: "gpio-salidas-digitales-led"
            title: "2.2 GPIO en MicroPython: salidas digitales (LED)"
            duration: "45 min"
            content_file: "cap-2-2-gpio-salidas-digitales-led.md"
          - type: "lesson"
            id: "les-leng-int-2-3"
            slug: "entradas-digitales-pulsadores"
            title: "2.3 Entradas digitales con pulsadores y resistencias pull-up"
            duration: "45 min"
            content_file: "cap-2-3-entradas-digitales-pulsadores.md"

      - id: "chap-eval-leng-int-a"
        title: "Evaluación de la Sección A"
        description: "Comprobá tus conocimientos de microcontroladores y del ESP32-WROOM."
        items:
          - type: "quiz"
            id: "quiz-leng-int-a"
            slug: "cuestionario-microcontrolador-esp32"
            title: "Cuestionario: El Microcontrolador y el ESP32"
            duration: "20 min"
            questions:
              - id: "q-leng-microcontrolador"
                question: "¿Cuál de las siguientes afirmaciones describe mejor a un microcontrolador?"
                type: "single_choice"
                options:
                  - "Es un sistema abierto que se construye acoplándole módulos externos según lo que se desee."
                  - "Es un sistema cerrado que contiene un computador completo y de prestaciones limitadas, destinado a gobernar una sola tarea."
                  - "Es un circuito que solo almacena datos de forma no volátil."
                correct_option: 1
                explanation: "El microcontrolador es un sistema cerrado que integra procesador, memoria y periféricos en un solo chip, dedicado a controlar una tarea determinada."
              - id: "q-leng-rom-flash"
                question: "¿Qué tipo de memoria de programa se puede escribir y borrar en el propio circuito, garantizando alrededor de 1.000 ciclos de escritura-borrado?"
                type: "single_choice"
                options:
                  - "ROM con máscara"
                  - "OTP"
                  - "Memoria FLASH"
                correct_option: 2
                explanation: "La memoria FLASH es no volátil, de bajo consumo, se puede escribir y borrar en circuito y es la tecnología usada por los ESP32 para guardar el firmware."
              - id: "q-leng-repl"
                question: "El REPL de MicroPython permite ejecutar sentencias e interactuar con la placa en tiempo real a través de una consola serie."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "REPL significa Read-Eval-Print Loop: lee lo que escribís, lo evalúa, muestra el resultado y vuelve a esperar, ideal para probar ideas rápidamente."
              - id: "q-leng-pullup"
                question: "¿Qué configuración es típica para leer un pulsador con un pin del ESP32 en MicroPython sin resistencias externas?"
                type: "single_choice"
                options:
                  - "Pin configurado como salida (Pin.OUT)"
                  - "Pin como entrada con resistencia pull-up interna (Pin.PULL_UP)"
                  - "Pin configurado como analógico (ADC)"
                correct_option: 1
                explanation: "El ESP32 dispone de resistencias pull-up internas configurables por programa, que evitan colocar una resistencia externa entre el pin y la alimentación."

  # --- SECCIÓN B ---
  - id: "sec-leng-int-b"
    title: "Sección B: Periféricos"
    description: "Entradas analógicas (ADC), señales PWM y comunicación I2C con pantalla OLED."
    chapters:
      - id: "chap-leng-int-3"
        title: "Cap 3: Entradas Analógicas y PWM"
        description: "Lectura de señales analógicas con el conversor ADC y generación de señales PWM."
        items:
          - type: "lesson"
            id: "les-leng-int-3-1"
            slug: "adc-potenciometro-ldr"
            title: "3.1 Entradas analógicas con ADC: potenciómetro y LDR"
            duration: "50 min"
            content_file: "cap-3-1-adc-potenciometro-ldr.md"
          - type: "lesson"
            id: "les-leng-int-3-2"
            slug: "pwm-brillo-salidas"
            title: "3.2 Señales PWM: control de brillo de un LED"
            duration: "45 min"
            content_file: "cap-3-2-pwm-brillo-salidas.md"

      - id: "chap-leng-int-4"
        title: "Cap 4: Comunicación I2C y Pantalla OLED"
        description: "Fundamentos del bus I2C y manejo de la pantalla OLED SSD1306 con framebuffer."
        items:
          - type: "lesson"
            id: "les-leng-int-4-1"
            slug: "i2c-oled-ssd1306"
            title: "4.1 Comunicación I2C y pantalla OLED SSD1306"
            duration: "55 min"
            content_file: "cap-4-1-i2c-oled-ssd1306.md"
          - type: "lesson"
            id: "les-leng-int-4-2"
            slug: "dibujo-framebuffer-oled"
            title: "4.2 Dibujo con framebuffer: formas y texto en la OLED"
            duration: "50 min"
            content_file: "cap-4-2-dibujo-framebuffer-oled.md"

      - id: "chap-eval-leng-int-b"
        title: "Evaluación de la Sección B"
        description: "Comprobá tus conocimientos de ADC, PWM, I2C y la pantalla OLED."
        items:
          - type: "quiz"
            id: "quiz-leng-int-b"
            slug: "cuestionario-perifericos-esp32"
            title: "Cuestionario: Periféricos del ESP32"
            duration: "20 min"
            questions:
              - id: "q-leng-adc"
                question: "El conversor ADC del ESP32 transforma una señal analógica en un valor digital. En MicroPython, ese valor se obtiene con:"
                type: "single_choice"
                options:
                  - "adc.read()"
                  - "adc.write()"
                  - "pin.digital()"
                correct_option: 0
                explanation: "Una vez creado el objeto ADC sobre un pin, el método read() devuelve el valor digital proporcional a la tensión medida en el pin."
              - id: "q-leng-pwm"
                question: "En PWM, el ciclo de trabajo (duty cycle) determina el tiempo en que la señal está en nivel alto. Un duty de 0% equivale a:"
                type: "single_choice"
                options:
                  - "LED a brillo máximo"
                  - "LED apagado"
                  - "LED al 50% de brillo"
                correct_option: 1
                explanation: "Con un ciclo de trabajo de 0% la señal nunca está en nivel alto, por lo que el LED permanece apagado; 100% lo deja encendido al máximo."
              - id: "q-leng-i2c"
                question: "El bus I2C utiliza dos líneas: una de datos (SDA) y una de reloj (SCL), y permite conectar múltiples dispositivos en la misma red."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "I2C es un bus serie de dos hilos donde cada dispositivo tiene una dirección única, lo que permite conectar varios periféricos al mismo par de pines."
              - id: "q-leng-framebuffer"
                question: "La técnica de framebuffer consiste en dibujar primero en un buffer en memoria y luego enviarlo completo a la pantalla con una sola instrucción."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "En la OLED SSD1306 se dibuja sobre un buffer (show() en los drivers típicos) y se actualiza la pantalla completa, evitando parpadeos."
