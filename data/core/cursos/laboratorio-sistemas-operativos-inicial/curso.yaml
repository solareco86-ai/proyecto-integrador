            duration: "50 min"
            content_file: "cap-5-2-comandos-navegacion-archivos.md"
          - type: "lesson"
            id: "les-lso-ini-5-3"
            slug: "permisos-usuarios-sudo"
            title: "5.3 Permisos, usuarios y sudo"
            duration: "50 min"
            content_file: "cap-5-3-permisos-usuarios-sudo.md"

      - id: "chap-lso-ini-6"
        title: "Cap 6: Arranque y carga del sistema"
        description: "El proceso de arranque (BIOS/UEFI, GRUB y systemd), niveles de ejecución y apagado de la sesión."
        items:
          - type: "lesson"
            id: "les-lso-ini-6-1"
            slug: "proceso-arranque-grub-systemd"
            title: "6.1 El proceso de arranque: BIOS/UEFI, GRUB y systemd"
            duration: "50 min"
            content_file: "cap-6-1-proceso-arranque-grub-systemd.md"
          - type: "lesson"
            id: "les-lso-ini-6-2"
            slug: "niveles-ejecucion-apagado-sesion"
            title: "6.2 Niveles de ejecución, apagado y administración de la sesión"
            duration: "45 min"
            content_file: "cap-6-2-niveles-ejecucion-apagado-sesion.md"

      - id: "chap-eval-lso-ini-c"
        title: "Evaluación de la Sección C"
        description: "Comprobá tus conocimientos sobre terminal, archivos, permisos y arranque del sistema."
        items:
          - type: "quiz"
            id: "quiz-lso-ini-c"
            slug: "cuestionario-terminal-archivos-arranque"
            title: "Cuestionario: Terminal, Archivos y Arranque"
            duration: "20 min"
            questions:
              - id: "q-lso-ini-ls"
                question: "¿Qué comando lista los archivos de un directorio incluyendo los ocultos (que empiezan con un punto)?"
                type: "single_choice"
                options:
                  - "ls -a"
                  - "pwd"
                  - "whoami"
                  - "touch"
                correct_option: 0
                explanation: "La opción -a (all) de ls muestra también los archivos ocultos, como los que comienzan con '.'."
              - id: "q-lso-ini-perm"
                question: "El permiso de ejecución es necesario para poder correr un programa o un script."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "Sin el bit de ejecución (x) el sistema no permite correr un archivo; se otorga con chmod +x."
              - id: "q-lso-ini-grub"
                question: "¿Qué función cumple GRUB durante el arranque del sistema?"
                type: "single_choice"
                options:
                  - "Permite elegir qué sistema operativo o núcleo cargar"
                  - "Descomprime los archivos de usuario"
                  - "Administra las impresoras"
                  - "Configura el firewall"
                correct_option: 0
                explanation: "GRUB es el gestor de arranque que presenta el menú para seleccionar el sistema operativo o la versión del núcleo a iniciar."
