id: "laboratorio-sistemas-operativos-inicial"
slug: "laboratorio-sistemas-operativos-inicial"
title: "Laboratorio de Sistemas Operativos: Nivel Inicial"
description_short: "Concepto de sistema operativo, instalación de Debian con escritorio XFCE, terminal, comandos básicos, manejo de archivos y personalización de la interface."
description_long: "Este es el primer nivel del vertical Laboratorio de Sistemas Operativos, basado en Debian con escritorio XFCE y un enfoque 100% práctico. Empezarás entendiendo qué es un sistema operativo: sus funciones, estructura y cómo trabaja, junto con las herramientas de diagnóstico que brinda. Luego instalarás Debian desde cero con el escritorio XFCE, explorarás el panel de control y las visualizaciones que ofrece, instalarás y actualizarás elementos optativos con el gestor de paquetes y personalizarás la interface para que te resulte más cómoda. Finalmente trabajarás con la terminal: estructura de directorios, comandos de navegación y gestión de archivos, permisos y usuarios, y entenderás cómo arranca y se carga el sistema (BIOS/UEFI, GRUB y systemd). No se requieren conocimientos previos: el curso asume un punto de partida inicial y cada tema incluye una práctica de laboratorio."
duration: "48 horas de cursada"
level: "Inicial"
language: "Español"
price: 0.0
og_image: "/static/media/cursos/og-laboratorio-sistemas-operativos-inicial.webp"
og_image_width: 1200
og_image_height: 630
instructor_id: "agustin-bustos"
academic_only: true
sections:
  # --- SECCIÓN A ---
  - id: "sec-lso-ini-a"
    title: "Sección A: Concepto de Sistema Operativo"
    description: "Funciones y estructura del sistema operativo, cómo trabaja y las herramientas de diagnóstico que brinda."
    chapters:
      - id: "chap-lso-ini-1"
        title: "Cap 1: ¿Qué es un sistema operativo?"
        description: "Funciones del sistema operativo, su estructura interna y una descripción elemental de cómo trabaja."
        items:
          - type: "lesson"
            id: "les-lso-ini-1-1"
            slug: "funciones-estructura-so"
            title: "1.1 Funciones y estructura de un sistema operativo"
            duration: "45 min"
            content_file: "cap-1-1-funciones-estructura-so.md"
          - type: "lesson"
            id: "les-lso-ini-1-2"
            slug: "como-trabaja-so"
            title: "1.2 Cómo trabaja el sistema: servicios y componentes"
            duration: "45 min"
            content_file: "cap-1-2-como-trabaja-so.md"

      - id: "chap-lso-ini-2"
        title: "Cap 2: Herramientas de diagnóstico que brinda el SO"
        description: "Monitorización básica y primeras herramientas de diagnóstico de discos, memoria, procesos y servicios."
        items:
          - type: "lesson"
            id: "les-lso-ini-2-1"
            slug: "panel-control-monitorizacion"
            title: "2.1 Panel de control y monitorización básica"
            duration: "50 min"
            content_file: "cap-2-1-panel-control-monitorizacion.md"
          - type: "lesson"
            id: "les-lso-ini-2-2"
            slug: "herramientas-diagnostico"
            title: "2.2 Primeras herramientas de diagnóstico (df, free, top, systemctl)"
            duration: "50 min"
            content_file: "cap-2-2-herramientas-diagnostico.md"

      - id: "chap-eval-lso-ini-a"
        title: "Evaluación de la Sección A"
        description: "Comprobá tus conocimientos sobre el concepto, las funciones y el diagnóstico de un sistema operativo."
        items:
          - type: "quiz"
            id: "quiz-lso-ini-a"
            slug: "cuestionario-concepto-so"
            title: "Cuestionario: Concepto de Sistema Operativo"
            duration: "20 min"
            questions:
              - id: "q-lso-ini-funciones"
                question: "¿Cuál de las siguientes es una función fundamental de un sistema operativo?"
                type: "single_choice"
                options:
                  - "Administrar los recursos de hardware (CPU, memoria, almacenamiento)"
                  - "Diseñar circuitos impresos"
                  - "Redactar documentos de texto por sí solo"
                  - "Generar facturas de venta"
                correct_option: 0
                explanation: "El sistema operativo gestiona el hardware y lo pone a disposición de las aplicaciones y del usuario de forma ordenada."
              - id: "q-lso-ini-kernel"
                question: "El núcleo (kernel) es el componente central del sistema operativo que se ejecuta todo el tiempo y administra los recursos."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "El kernel es el corazón del sistema: gestiona procesos, memoria, archivos y dispositivos, y permanece cargado en memoria durante la ejecución."
              - id: "q-lso-ini-diagnostico"
                question: "¿Qué herramienta muestra información de la memoria RAM utilizada y disponible en tiempo real?"
                type: "single_choice"
                options:
                  - "free"
                  - "df"
                  - "ls"
                  - "whoami"
                correct_option: 0
                explanation: "free reporta el uso de la memoria física y de intercambio (swap). df, en cambio, muestra el espacio de los sistemas de archivos."

  # --- SECCIÓN B ---
  - id: "sec-lso-ini-b"
    title: "Sección B: Instalación y Manejo de Debian con XFCE"
    description: "Instalación del sistema operativo, manejo del escritorio XFCE, gestor de paquetes y personalizaciones que ayudan al usuario."
    chapters:
      - id: "chap-lso-ini-3"
        title: "Cap 3: Instalación del sistema operativo"
        description: "Requisitos, preparación del medio, particionado y pasos de la instalación de Debian con escritorio XFCE."
        items:
          - type: "lesson"
            id: "les-lso-ini-3-1"
            slug: "requisitos-preparacion-instalacion"
            title: "3.1 Requisitos y preparación del medio de instalación"
            duration: "50 min"
            content_file: "cap-3-1-requisitos-preparacion-instalacion.md"
          - type: "lesson"
            id: "les-lso-ini-3-2"
            slug: "instalacion-debian-xfce"
            title: "3.2 Instalación de Debian con escritorio XFCE paso a paso"
            duration: "60 min"
            content_file: "cap-3-2-instalacion-debian-xfce.md"
          - type: "lesson"
            id: "les-lso-ini-3-3"
            slug: "primera-configuracion-verificacion"
            title: "3.3 Primera configuración y verificación del sistema"
            duration: "45 min"
            content_file: "cap-3-3-primera-configuracion-verificacion.md"

      - id: "chap-lso-ini-4"
        title: "Cap 4: Manejo del escritorio XFCE"
        description: "Visualizaciones que brinda el sistema, instalación y actualización de elementos optativos y personalizaciones."
        items:
          - type: "lesson"
            id: "les-lso-ini-4-1"
            slug: "escritorio-panel-visualizaciones"
            title: "4.1 El escritorio, el panel y las visualizaciones que brinda"
            duration: "45 min"
            content_file: "cap-4-1-escritorio-panel-visualizaciones.md"
          - type: "lesson"
            id: "les-lso-ini-4-2"
            slug: "instalacion-actualizacion-paquetes"
            title: "4.2 Instalación y actualización de elementos optativos con el gestor de paquetes"
            duration: "50 min"
            content_file: "cap-4-2-instalacion-actualizacion-paquetes.md"
          - type: "lesson"
            id: "les-lso-ini-4-3"
            slug: "personalizaciones-interface"
            title: "4.3 Personalizaciones que ayudan al usuario"
            duration: "45 min"
            content_file: "cap-4-3-personalizaciones-interface.md"

      - id: "chap-eval-lso-ini-b"
        title: "Evaluación de la Sección B"
        description: "Comprobá tus conocimientos sobre la instalación y el manejo del sistema operativo."
        items:
          - type: "quiz"
            id: "quiz-lso-ini-b"
            slug: "cuestionario-instalacion-manejo-so"
            title: "Cuestionario: Instalación y Manejo del Sistema Operativo"
            duration: "20 min"
            questions:
              - id: "q-lso-ini-particion"
                question: "¿Qué comando de apt permite actualizar la lista de paquetes disponibles desde los repositorios?"
                type: "single_choice"
                options:
                  - "apt update"
                  - "apt remove"
                  - "apt autoremove"
                  - "dpkg --status"
                correct_option: 0
                explanation: "apt update refresca la lista local de paquetes disponibles; luego apt upgrade actualiza los instalados."
              - id: "q-lso-ini-xfce"
                question: "XFCE es un entorno de escritorio liviano, ideal para equipos con recursos limitados."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "XFCE se destaca por ser rápido y liviano, consumir poca memoria y ser fácilmente personalizable."
              - id: "q-lso-ini-sudo"
                question: "¿Para qué sirve el comando sudo?"
                type: "single_choice"
                options:
                  - "Ejecutar un comando con privilegios de administrador (root)"
                  - "Borrar archivos temporales"
                  - "Cambiar el fondo de pantalla"
                  - "Ver el historial de comandos"
                correct_option: 0
                explanation: "sudo permite ejecutar comandos administrativos con permisos elevados, previa autenticación del usuario."

  # --- SECCIÓN C ---
  - id: "sec-lso-ini-c"
    title: "Sección C: Terminal, Archivos y Arranque"
    description: "La terminal y la estructura de directorios, comandos de manejo de archivos, permisos, y el arranque y carga del sistema."
    chapters:
      - id: "chap-lso-ini-5"
