            title: "5.1 La terminal y la estructura de directorios"
            duration: "45 min"
            content_file: "cap-5-1-terminal-estructura-directorios.md"
          - type: "lesson"
            id: "les-lso-ini-5-2"
            slug: "comandos-navegacion-archivos"
