id: "procesamiento-aprendizaje-automatico-inicial"
slug: "procesamiento-aprendizaje-automatico-inicial"
title: "Procesamiento de Aprendizaje Automático: Nivel Inicial"
description_short: "Nivelación práctica en terminal Linux, control de versiones con Git, entornos virtuales, pair programming con Aider, OpenCode y AGY CLI, y tu primera API REST con FastAPI."
description_long: "Este curso de nivelación es el punto de partida fundamental de la cátedra Procesamiento de Aprendizaje Automático para estudiantes que necesitan consolidar sus bases de desarrollo antes de construir modelos de inferencia. A lo largo del trayecto dominarás el uso de la terminal de comandos Bash, la gestión de entornos virtuales en Python (venv), y el control de versiones atómico con Git (el motor de diffs que utilizan los asistentes de código). Aprenderás a configurar e interactuar con la tríada de agentes de desarrollo (Aider, OpenCode y AGY CLI) mediante instrucciones técnicas precisas y auditoría de cambios. Finalmente, construirás tu primer servicio web con FastAPI, entendiendo la estructura de peticiones HTTP, esquemas JSON y la transición conceptual de reglas cableadas a mano hacia el procesamiento guiado por datos. Modalidad 100% práctica de aula-taller."
duration: "20 horas de cursada"
level: "Inicial"
language: "Español"
price: 0.0
