id: "lenguajes-electronicos-basico"
slug: "lenguajes-electronicos-basico"
title: "Lenguajes Electrónicos: Nivel Básico"
description_short: "Fundamentos de la programación: algoritmos, pseudo código, niveles de lenguaje, diagramas de flujo e introducción al lenguaje MicroPython."
description_long: "Este es el primer nivel del vertical Lenguajes Electrónicos. Aprenderás desde cero qué significa programar: las etapas para desarrollar un programa, el uso del algoritmo y del pseudo código para diseñar soluciones, la clasificación de los lenguajes de programación en bajo, medio y alto nivel, y la diagramación lógica con diagramas de flujo. En la segunda parte te introducimos al lenguaje MicroPython, la versión de Python pensada para microcontroladores: estructura de un programa, tipos de datos, variables y constantes, operadores aritméticos, relacionales y lógicos, estructuras condicionales, bucles de repetición, funciones y módulos. En este nivel no se requiere placa electrónica: todos los ejemplos se ejecutan en la computadora con Python 3 o una consola MicroPython, por lo que podés comenzar sin ningún hardware."
duration: "24 horas de cursada"
level: "Inicial"
language: "Español"
price: 0.0
instructor_id: "agustin-bustos"
academic_only: true
sections:
  # --- SECCIÓN A ---
  - id: "sec-leng-bas-a"
    title: "Sección A: Fundamentos de la Programación"
    description: "Pasos para desarrollar un programa, algoritmos y pseudo código, niveles de lenguaje y diagramas de flujo."
    chapters:
      - id: "chap-leng-bas-1"
        title: "Cap 1: Introducción a la Programación"
        description: "Definición de programación, etapas para desarrollar un programa y uso práctico del pseudo código."
        items:
          - type: "lesson"
            id: "les-leng-bas-1-1"
            slug: "pasos-desarrollar-programa"
            title: "1.1 ¿Qué es programar? Pasos para desarrollar un programa"
            duration: "45 min"
            content_file: "cap-1-1-pasos-desarrollar-programa.md"
          - type: "lesson"
            id: "les-leng-bas-1-2"
            slug: "algoritmos-pseudocodigo"
            title: "1.2 Algoritmos y Pseudo Código"
            duration: "45 min"
            content_file: "cap-1-2-algoritmos-pseudocodigo.md"

      - id: "chap-leng-bas-2"
        title: "Cap 2: Niveles de Lenguaje"
        description: "Lenguajes de bajo, medio y alto nivel; entornos de programación, compiladores e intérpretes."
        items:
          - type: "lesson"
            id: "les-leng-bas-2-1"
            slug: "lenguajes-bajo-nivel"
            title: "2.1 Lenguajes de bajo nivel: binario, máquina y ensamblador"
            duration: "45 min"
            content_file: "cap-2-1-lenguajes-bajo-nivel.md"
          - type: "lesson"
            id: "les-leng-bas-2-2"
            slug: "lenguajes-medio-alto-nivel"
            title: "2.2 Lenguajes de medio y alto nivel, entornos, compiladores e intérpretes"
            duration: "45 min"
            content_file: "cap-2-2-lenguajes-medio-alto-nivel.md"

      - id: "chap-leng-bas-3"
        title: "Cap 3: Diagramas de Flujo"
        description: "Reglas, símbolos estándares, operadores y ejemplo completo de diagramación lógica."
        items:
          - type: "lesson"
            id: "les-leng-bas-3-1"
            slug: "diagramas-flujo-reglas-simbolos"
            title: "3.1 Diagramas de flujo: cómo realizarlos, reglas y símbolos estándares"
            duration: "50 min"
            content_file: "cap-3-1-diagramas-flujo-reglas-simbolos.md"
          - type: "lesson"
            id: "les-leng-bas-3-2"
            slug: "diagramas-flujo-operadores-ejemplo"
            title: "3.2 Operadores estándares y ejemplo: suma de los 20 primeros naturales"
            duration: "50 min"
            content_file: "cap-3-2-diagramas-flujo-operadores-ejemplo.md"

      - id: "chap-eval-leng-bas-a"
        title: "Evaluación de la Sección A"
        description: "Comprobá tus conocimientos de fundamentos de la programación, niveles de lenguaje y diagramas de flujo."
        items:
          - type: "quiz"
            id: "quiz-leng-bas-a"
            slug: "cuestionario-fundamentos-programacion"
            title: "Cuestionario: Fundamentos de la Programación"
            duration: "20 min"
            questions:
              - id: "q-leng-algoritmo"
                question: "¿Cuál de las siguientes etapas del desarrollo de un programa consiste en chequear el algoritmo paso a paso para verificar que resuelve el problema?"
                type: "single_choice"
                options:
                  - "Etapa de implementación específica"
                  - "Etapa de prueba (Prueba de Escritorio)"
                  - "Etapa de análisis"
                  - "Etapa de uso"
                correct_option: 1
                explanation: "La prueba de escritorio consiste en simular la ejecución del algoritmo paso a paso antes de codificar, para confirmar que la solución es correcta."
              - id: "q-leng-pseudocodigo"
                question: "El Pseudo Código es una forma de diagramar un algoritmo sin atenerse a la sintaxis de ningún lenguaje de programación en especial."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "El pseudo código es un borrador en lenguaje común que sirve para comunicar la estructura del programa a todos los programadores, independientemente del lenguaje que usen."
              - id: "q-leng-niveles"
                question: "¿Qué tipo de lenguaje de programación se encuentra más cerca del lenguaje de la computadora y es más económico en el uso de recursos?"
                type: "single_choice"
                options:
                  - "Lenguaje de alto nivel"
                  - "Lenguaje de medio nivel"
                  - "Lenguaje de bajo nivel"
                correct_option: 2
                explanation: "Mientras más bajo es el nivel del lenguaje, más cerca está del lenguaje de la máquina y menos recursos de memoria consume, aunque es más difícil de estructurar."
              - id: "q-leng-simbolo-decision"
                question: "En un diagrama de flujo, ¿qué símbolo es el único que puede tener más de una línea de flujo de salida?"
                type: "single_choice"
                options:
                  - "El símbolo de proceso"
                  - "El símbolo de entrada"
                  - "El símbolo de decisión o bifurcación"
                correct_option: 2
                explanation: "Solo el símbolo de decisión puede y debe tener más de una línea de salida, para representar el camino del SI y del NO."

  # --- SECCIÓN B ---
