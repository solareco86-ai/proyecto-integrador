          - type: "lesson"
            id: "les-leng-bas-4-4"
            slug: "bucles-micropython"
            title: "4.4 Control de flujo: estructuras de repetición (while y for)"
            duration: "45 min"
            content_file: "cap-4-4-bucles-micropython.md"
          - type: "lesson"
            id: "les-leng-bas-4-5"
            slug: "funciones-modulos-micropython"
            title: "4.5 Funciones y módulos en MicroPython"
            duration: "45 min"
            content_file: "cap-4-5-funciones-modulos-micropython.md"

      - id: "chap-eval-leng-bas-b"
        title: "Evaluación de la Sección B"
        description: "Comprobá tus conocimientos del lenguaje MicroPython."
        items:
          - type: "quiz"
            id: "quiz-leng-bas-b"
            slug: "cuestionario-micropython-fundamentos"
            title: "Cuestionario: Introducción a MicroPython"
            duration: "20 min"
            questions:
              - id: "q-leng-mpy-sintaxis"
                question: "En MicroPython, la indentación (sangría) es parte de la sintaxis y delimita los bloques de código, a diferencia de las llaves en otros lenguajes."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "En MicroPython los bloques se delimitan por indentación y dos puntos, no por llaves ni palabras clave de fin como en C o Pascal."
              - id: "q-leng-mpy-tipos"
                question: "¿Cuál de las siguientes secuencias declara una variable entera, una flotante y una cadena de caracteres en MicroPython?"
                type: "single_choice"
                options:
                  - "int a; float b; char c;"
                  - "a = 10; b = 3.14; c = \"hola\""
                  - "var a: int = 10; var b: float = 3.14;"
                correct_option: 1
                explanation: "MicroPython no declara el tipo: se asigna directamente un valor y el tipo se infiere automáticamente (int, float, str)."
              - id: "q-leng-mpy-for"
                question: "En MicroPython, la sentencia for permite repetir un bloque de código un número conocido de veces. ¿Cuál de los siguientes encabezados es válido?"
                type: "single_choice"
                options:
                  - "for (i=0; i<10; i=i+1)"
                  - "for i in range(10)"
                  - "for i from 0 to 10"
                correct_option: 1
                explanation: "A diferencia de C, en MicroPython el for itera sobre un iterable: for i in range(10) repite el bloque 10 veces con i valiendo 0, 1, ..., 9."
              - id: "q-leng-mpy-print"
                question: "¿Qué muestra en pantalla print(2 ** 3)?"
                type: "single_choice"
                options:
                  - "8"
                  - "6"
                  - "2 elevado a la 3, sin calcularse"
                correct_option: 0
                explanation: "El operador ** es la potenciación en Python y MicroPython: 2 elevado a la 3 es 8."
