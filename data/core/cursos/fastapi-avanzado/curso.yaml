id: "fastapi-avanzado"
slug: "fastapi-avanzado"
title: "FastAPI Avanzado: MLOps, Async DB y Producción"
description_short: "Llevá tus APIs FastAPI a producción: bases de datos asíncronas, seguridad, testing, Docker, MLOps y despliegue."
description_long: "Este curso avanzado te lleva tus APIs FastAPI al nivel de producción. Aprenderás a integrar bases de datos asíncronas con SQLAlchemy y Alembic, a implementar autenticación y seguridad con OAuth2 y JWT, y a construir comunicación en tiempo real con WebSockets. También desarrollarás estrategias de testing asíncrono con pytest y HTTPX, y desplegarás tu aplicación con Docker, Gunicorn, Nginx y GitHub Actions. En la parte final aplicarás ciencia de datos en producción: análisis con NumPy y Pandas, entrenamiento de modelos con scikit-learn, un endpoint de predicción eficiente y un sistema de detección en tiempo real con OpenCV y WebSockets. Prerrequisitos: haber completado el curso Desarrollo de APIs con FastAPI y Python (fastapi-intermedio) o contar con experiencia equivalente en FastAPI, Pydantic e inyección de dependencias."
duration: "25 horas de cursada"
level: "Avanzado"
language: "Español"
price: 0.0
og_image: "/static/media/cursos/og-fastapi-avanzado.webp"
og_image_width: 1200
og_image_height: 630
instructor_id: "agustin-bustos"
