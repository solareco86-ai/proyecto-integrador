id: "procesamiento-aprendizaje-automatico-intermedio"
slug: "procesamiento-aprendizaje-automatico-intermedio"
title: "Procesamiento de Aprendizaje Automático: Nivel Intermedio"
description_short: "Inferencia y clasificación supervisada en FastAPI: esquemas Pydantic, ciclo de vida lifespan, clasificadores Bayesianos, k-NN, métricas de evaluación y TDD guiado por agentes."
description_long: "En este segundo nivel de la cátedra Procesamiento de Aprendizaje Automático, avanzarás desde los fundamentos de programación hacia la arquitectura de servicios de inferencia profesionales. Aprenderás a desacoplar el entrenamiento de la predicción, modelando esquemas estrictos con Pydantic y gestionando la memoria del servidor mediante el ciclo de vida lifespan de FastAPI. Estudiarás en profundidad la diferencia entre el razonamiento deductivo de los LLMs y el aprendizaje inductivo tradicional basado en datos. Implementarás clasificadores probabilísticos (Naive Bayes) y basados en instancias (k-Nearest Neighbors) como endpoints REST de alto rendimiento, junto con la instrumentación de métricas de evaluación objetivas (matriz de confusión, precisión, recall y F1-score). Durante todo el trayecto aplicarás Desarrollo Guiado por Pruebas (TDD) asistido por la tríada Aider, OpenCode y AGY CLI. Modalidad 100% práctica de aula-taller."
duration: "24 horas de cursada"
level: "Intermedio"
language: "Español"
price: 0.0
og_image: "/static/media/cursos/og-procesamiento-aprendizaje-automatico-intermedio.webp"
og_image_width: 1200
og_image_height: 630
instructor_id: "agustin-bustos"
academic_only: true
sections:
  # --- SECCIÓN A ---
  - id: "sec-paa-int-a"
    title: "Sección A: Inferencia, Contratos de Datos y Ciclo de Vida en FastAPI"
    description: "Diseño de APIs de inferencia robustas, validación rigurosa de features y administración de modelos en memoria de servidor."
    chapters:
      - id: "chap-paa-int-1"
        title: "Cap 1: Arquitectura de Inferencia y Esquemas Pydantic"
        description: "Tipado estricto de entradas y salidas, persistencia con joblib y ciclo de vida de aplicación con lifespan."
        items:
          - type: "lesson"
            id: "les-paa-int-1-1"
            slug: "paa-int-pydantic-esquemas-ml"
            title: "1.1 Modelado de features con Pydantic: validación, rangos y tipado"
            duration: "25 min"
            content_file: "cap-1-1-pydantic-esquemas-ml.md"
          - type: "lesson"
            id: "les-paa-int-1-2"
            slug: "paa-int-fastapi-lifespan-modelos"
            title: "1.2 Gestión de memoria en FastAPI: carga del modelo en el lifespan"
            duration: "25 min"
            content_file: "cap-1-2-fastapi-lifespan-modelos.md"
          - type: "lesson"
            id: "les-paa-int-1-3"
