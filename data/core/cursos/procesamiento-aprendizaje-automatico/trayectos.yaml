trayectos:
  - id: trayecto-i-inferencia-estadistica
    title: 'Trayecto I: Inferencia Estadística, Modelado y MLOps'
    slug: trayecto-i-inferencia-estadistica
    description: >-
      Puente activo con NumPy, APIs de inferencia robustas con Pydantic, algoritmos estadísticos
      (Bayes, k-NN) y evaluación rigurosa con métricas (matriz de confusión, precisión/recall).
      Énfasis en construcción de pipelines seguros sin data leakage temporal.
    duration: 25 horas de cursada
    level: Intermedio
    prerequisitos:
      - Haber completado Unidad 1 (Fundamentos): Terminal, Git, Python, Auditoría de Código
      - Conocimiento básico de programación Python (funciones, listas, diccionarios)
      - Familiaridad con git clone y git status
    objetivos_de_aprendizaje:
      - Vectorizar operaciones numéricas con NumPy (tensores, broadcasting)
      - Validar telemetría con Pydantic y restricciones de dominio
      - Implementar clasificadores probabilísticos (Naive Bayes) y basados en instancias (k-NN)
      - Prevenir data leakage temporal en series de tiempo de energía
      - Evaluar modelos con matriz de confusión, precisión, recall y F1-score
      - Construir pipelines TDD con pytest en FastAPI
      - Exponer métricas de rendimiento en tiempo real (GET /metrics)
    cronograma:
      - semana: 1-2
        capitulos:
          - cap-0-1-numpy-vectores-telemetria
          - cap-1-1-pydantic-esquemas-ml
          - cap-1-2-fastapi-lifespan-modelos
          - cap-1-3-serializacion-joblib
        hito: Validación de telemetría con Pydantic en energy-ml
      - semana: 3
        capitulos:
          - cap-2-1-deduccion-vs-induccion
          - cap-2-2-subtareas-del-aprendizaje
        hito: Partición cronológica segura (sin data leakage temporal)
      - semana: 4-5
        capitulos:
          - cap-3-1-teorema-bayes-clasificacion
          - cap-3-2-endpoint-naive-bayes-opencode
        hito: Endpoint POST /classify/bayes con confianza y auditoría
      - semana: 5-6
        capitulos:
          - cap-4-1-knn-distancias-normalizacion
          - cap-4-2-endpoint-knn-fastapi
        hito: Endpoint POST /classify/knn con escalado seguro
      - semana: 6-7
        capitulos:
          - cap-5-1-metricas-confusion-f1
          - cap-5-2-tdd-pytest-aider-agy
          - cap-5-3-endpoint-metricas-observabilidad
        hito: Exposición de métricas de rendimiento en tiempo real (GET /metrics)
    criterios_de_acreditacion:
      - completitud: Aprobar 100% de las 13 lecciones (lecturas + laboratorios)
      - evaluacion_formativa: Responder correctamente ≥ 80% de preguntas de razonamiento
      - caza_de_alucinaciones: Identificar bugs de IA en ≥ 80% de ejemplos de código
      - tdd: Implementar ≥ 2 endpoints con ciclo TDD (test-first) en energy-ml
      - metricas: Exposición de ≥ 4 métricas (TP, FP, FN, TN, precision, recall, F1) en GET /metrics
      - integracion: Tests de integración pasan (≥ 85% de cobertura)
    habilidades_certificadas:
      - Machine Learning Aplicado (Bayes, k-NN)
      - Validación de Datos con Pydantic
      - Construcción de APIs REST con FastAPI
      - TDD y Testing en Machine Learning
      - Evaluación Rigurosa de Modelos (matriz de confusión, métricas)
      - Prevención de Data Leakage en Series Temporales

  - id: trayecto-ii-inteligencia-neuro-simbolica
    title: 'Trayecto II: Inteligencia Neuro-Simbólica y Orquestación con Agentes'
    slug: trayecto-ii-inteligencia-neuro-simbolica
    description: >-
      Aprendizaje de conceptos interactivo (Candidate-Elimination), inducción de reglas formales
      (AQ/FOIL), explicabilidad en árboles de decisión (CART), y servidores Model Context Protocol (MCP)
      para orquestación autónoma de agentes IA.
    duration: 20 horas de cursada
    level: Avanzado
    prerequisitos:
      - Haber completado Trayecto I (Inferencia Estadística, Modelado y MLOps)
      - Dominio de validación con Pydantic y construcción de endpoints FastAPI
      - Experiencia con ciclos TDD y pytest
      - Comprensión de matriz de confusión y métricas de rendimiento
    objetivos_de_aprendizaje:
      - Implementar aprendizaje interactivo de conceptos (Candidate-Elimination)
      - Extraer reglas lógicas interpretables (AQ, FOIL)
      - Construir árboles de decisión con poda y explicabilidad JSON
      - Diseñar servidores MCP para comunicación agente-modelo
      - Orquestar pipelines de inferencia con agentes autónomos
      - Implementar auditoría y trazabilidad en decisiones de IA
    cronograma:
      - semana: 8-9
        capitulos:
          - cap-1-1-espacio-versiones-ce
          - cap-1-2-endpoint-version-space-step
        hito: Refinamiento interactivo de hipótesis con Candidate-Elimination
      - semana: 9-10
        capitulos:
          - cap-2-1-algoritmo-aq-cobertura
          - cap-2-2-programacion-logica-inductiva-foil
          - cap-2-3-endpoint-rules-auditoria
        hito: Extracción y auditoría de reglas lógicas (GET /rules)
      - semana: 10-11
        capitulos:
          - cap-3-1-entropia-ganancia-gini
          - cap-3-2-arboles-regresion-continuos
          - cap-3-3-exportacion-arbol-json
        hito: Árboles de decisión con poda y exportación JSON para auditoría
      - semana: 11-12
        capitulos:
          - cap-4-1-ast-poda-contexto-agentes
          - cap-4-2-servidor-mcp-fastapi
          - cap-4-3-proyecto-integrador-agentes
        hito: Servidor MCP y orquestación de pipeline con agentes autónomos
    criterios_de_acreditacion:
      - completitud: Aprobar 100% de las 10 lecciones (lecturas + laboratorios)
      - evaluacion_formativa: Responder correctamente ≥ 80% de preguntas de razonamiento
      - caza_de_alucinaciones: Identificar bugs de IA en ≥ 80% de ejemplos de código
      - reglas_interpretables: Extraer ≥ 1 conjunto de reglas (AQ o FOIL) con cobertura ≥ 70%
      - arboles_explicables: Exportar árbol de decisión en JSON con ≥ 10 nodos
      - servidor_mcp: Implementar servidor MCP con ≥ 2 herramientas registradas
      - integracion_agentes: Orquestar pipeline con ≥ 3 endpoints (bayes, reglas, árbol) invocados por agente
      - tests: Suite de tests integrados pasa (≥ 85% de cobertura)
    habilidades_certificadas:
      - Aprendizaje de Conceptos Interactivo (Candidate-Elimination)
      - Inducción de Reglas Lógicas (AQ, FOIL)
      - Árboles de Decisión y Poda (CART)
      - Explicabilidad y Auditoría de Modelos
      - Servidores Model Context Protocol (MCP)
      - Orquestación Autónoma de Agentes IA
      - Integración de Modelos Simbólicos y Estadísticos

estructura_temporal_total:
  inicio: 'Semana 1 (Unidad 1: Fundamentos)'
  trayecto_i: 'Semanas 1-7 (Unidad 2)'
  trayecto_ii: 'Semanas 8-12 (Unidad 3)'
  duracion_total: 60 horas de cursada
  modalidad: 100% práctica con laboratorios en energy-ml
  regimen: Cursada continua (semanal) o Trayectos independientes

flujo_permitido:
  - tipo: secuencial_completo
    descripcion: 'Unidad 1 → Trayecto I → Trayecto II'
  - tipo: trayectos_independientes
    descripcion: 'Unidad 1 → Trayecto I (EN PARALELO) Trayecto II (con prereq)'

certificaciones:
  - nivel: Certificado de Trayecto I
    requisito: Completar Trayecto I con ≥ 80% en evaluación formativa + caza de alucinaciones
    duracion_estimada: 4-5 semanas
    titulo_otorgado: Especialista en Machine Learning y MLOps (Nivel Intermedio)

  - nivel: Certificado de Trayecto II
    requisito: Completar Trayecto II con ≥ 80% en evaluación formativa + caza de alucinaciones
    duracion_estimada: 3-4 semanas
    titulo_otorgado: Especialista en Inteligencia Neuro-Simbólica y Orquestación de Agentes

  - nivel: Certificado Integral
    requisito: Completar Unidad 1 + Trayecto I + Trayecto II con ≥ 85% en todas las evaluaciones
    duracion_estimada: 8-10 semanas
    titulo_otorgado: Especialista en Procesamiento de Aprendizaje Automático y Agentes IA
