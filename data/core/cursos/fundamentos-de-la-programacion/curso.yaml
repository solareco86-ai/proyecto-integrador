id: "fundamentos-de-la-programacion"
slug: "fundamentos-de-la-programacion"
title: "Fundamentos de la Programación"
description_short: "Iniciación al pensamiento computacional y la lógica algorítmica: diagramas de flujo normalizados, pseudocódigo en PSeInt, estructuras de control y modularización."
description_long: "Este curso introduce a los estudiantes del primer año de tecnicaturas superiores al pensamiento computacional y la resolución estructurada de problemas. A través de la lógica algorítmica, diagramas de flujo normalizados y pseudocódigo en PSeInt, los estudiantes aprenderán a diseñar soluciones lógicas robustas, dominar las estructuras de control secuenciales, condicionales e iterativas, y aplicar la modularización antes de abordar lenguajes de programación de sintaxis estricta."
duration: "64 horas de cursada (4 horas semanales × 16 semanas, 1er año)"
level: "Inicial"
language: "Español"
price: 0.0
og_image: "/static/media/cursos/og-fundamentos-programacion.webp"
og_image_width: 1200
og_image_height: 630
instructor_id: "agustin-bustos"
academic_only: false

sections:
  - id: "sec-fp-0"
    title: "Sección 0: Introducción al Pensamiento Computacional y Herramientas"
    description: "Configuración del entorno de trabajo lógico, instalación y uso de PSeInt, y comprensión de los conceptos fundacionales de la computación."
    chapters:
      - id: "chap-fp-cap-0"
        title: "Cap 0: Pensamiento Computacional y Entorno"
        description: "Conceptos fundacionales de algoritmos y configuración del entorno de pseudocódigo en PSeInt."
        items:
          - type: "lesson"
            id: "les-fp-0-1"
            slug: "que-es-un-algoritmo"
            title: "0.1 ¿Qué es un algoritmo y por qué programar?"
            duration: "15 min"
            content_file: "cap-0-1-que-es-un-algoritmo.md"
          - type: "lesson"
            id: "les-fp-0-2"
            slug: "introduccion-a-pseint"
            title: "0.2 Introducción a PSeInt"
            duration: "20 min"
            content_file: "cap-0-2-introduccion-a-pseint.md"

  - id: "sec-fp-1"
    title: "Sección 1: Diagramas de Flujo y Estructuras Secuenciales"
    description: "Representación gráfica normalizada de algoritmos y modelado de operaciones de entrada, proceso y salida lineal."
    chapters:
      - id: "chap-fp-cap-1"
        title: "Cap 1: Diagramas de Flujo y Secuencias"
        description: "Normas ANSI/ISO, variables, constantes, tipos de datos y operadores en pseudocódigo."
        items:
          - type: "lesson"
            id: "les-fp-1-1"
            slug: "simbolos-normas-ansi-iso"
            title: "1.1 Símbolos y Normas ANSI/ISO"
            duration: "25 min"
            content_file: "cap-1-1-simbolos-normas-ansi-iso.md"
          - type: "lesson"
            id: "les-fp-1-2"
            slug: "variables-constantes-tipos-datos"
            title: "1.2 Variables, Constantes y Tipos de Datos"
            duration: "30 min"
            content_file: "cap-1-2-variables-constantes-tipos-datos.md"
          - type: "lesson"
            id: "les-fp-1-3"
            slug: "operadores-aritmeticos-relacionales"
            title: "1.3 Operadores Aritméticos y Relacionales"
            duration: "30 min"
            content_file: "cap-1-3-operadores-aritmeticos-relacionales.md"

  - id: "sec-fp-2"
    title: "Sección 2: Estructuras de Control Condicionales"
    description: "Toma de decisiones lógicas dentro del flujo del programa para ramificar la ejecución según diferentes escenarios."
    chapters:
      - id: "chap-fp-cap-2"
        title: "Cap 2: Estructuras Condicionales"
        description: "Condicionales simples, dobles, anidados y selección múltiple con Según / Casos."
        items:
          - type: "lesson"
            id: "les-fp-2-1"
            slug: "condicional-simple-doble"
            title: "2.1 Estructura Condicional Simple y Doble"
            duration: "35 min"
            content_file: "cap-2-1-condicional-simple-doble.md"
          - type: "lesson"
            id: "les-fp-2-2"
            slug: "condicional-anidada-multiple"
            title: "2.2 Estructura Condicional Anidada y Múltiple"
            duration: "40 min"
            content_file: "cap-2-2-condicional-anidada-multiple.md"

  - id: "sec-fp-3"
    title: "Sección 3: Estructuras de Control Iterativas (Bucles)"
    description: "Automatización de procesos repetitivos y control de flujos mediante contadores, acumuladores y condiciones de corte."
    chapters:
      - id: "chap-fp-cap-3"
        title: "Cap 3: Estructuras Iterativas"
        description: "Bucles Para, Mientras y Repetir Hasta con contadores y acumuladores."
        items:
          - type: "lesson"
            id: "les-fp-3-1"
            slug: "bucle-para-for"
            title: "3.1 Bucle Para / For"
            duration: "35 min"
            content_file: "cap-3-1-bucle-para-for.md"
          - type: "lesson"
            id: "les-fp-3-2"
            slug: "bucles-mientras-repetir-hasta"
            title: "3.2 Bucles Mientras y Repetir Hasta"
            duration: "40 min"
            content_file: "cap-3-2-bucles-mientras-repetir-hasta.md"

  - id: "sec-fp-4"
    title: "Sección 4: Modularización y Subprocesos"
    description: "División de problemas complejos en bloques más pequeños, mantenibles y reutilizables."
    chapters:
      - id: "chap-fp-cap-4"
        title: "Cap 4: Modularización"
        description: "Subprocesos, funciones, procedimientos y pasaje de parámetros por valor y por referencia."
        items:
          - type: "lesson"
            id: "les-fp-4-1"
            slug: "concepto-subproceso-funciones-procedimientos"
