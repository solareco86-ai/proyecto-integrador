            duration: "35 min"
            content_file: "cap-4-1-concepto-subproceso-funciones-procedimientos.md"
          - type: "lesson"
            id: "les-fp-4-2"
            slug: "pasaje-parametros-valor-referencia"
            title: "4.2 Pasaje de Parámetros por valor y referencia"
            duration: "40 min"
            content_file: "cap-4-2-pasaje-parametros-valor-referencia.md"
