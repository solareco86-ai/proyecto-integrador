      id: les-pp-visual-2-3
      slug: pp-visual-presentacion-defensa
      title: "2.3 Presentación y defensa del proyecto: storytelling, slides, timing"
      duration: 40 min
      content_file: cap-2-3-presentacion-defensa.md
  - id: chap-pp-visual-taller
    title: 'Taller 5: Dashboards y Defensa'
    description: "Taller integrador: creación de dashboards finales para ambos proyectos e integración de la presentación de defensa."
    items:
    - type: lesson
      id: les-pp-visual-taller-1
      slug: pp-visual-taller-dashboards
      title: "Taller 5: Dashboards finales y preparación de presentación de defensa"
      duration: 120 min
      content_file: taller-5-visual-dashboards.md
