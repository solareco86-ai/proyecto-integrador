      slug: pp-defense-oral-presentation
      title: "8.1 Presentación Oral: Cómo Contar la Historia del Proyecto"
      duration: 40 min
      content_file: unidad-8-1-oral-presentation.md
    - type: lesson
      id: les-pp-defense-8-2
      slug: pp-defense-qa-demo
      title: "8.2 Q&A y Demo en Vivo: Manejo de Preguntas y Troubleshooting"
      duration: 40 min
      content_file: unidad-8-2-qa-demo.md
    - type: lesson
      id: les-pp-defense-8-3
      slug: pp-defense-lecciones-aprendidas
      title: "8.3 Reflexión Crítica: Fortalezas, Debilidades, Mejoras Futuras"
      duration: 30 min
      content_file: unidad-8-3-lecciones-aprendidas.md
