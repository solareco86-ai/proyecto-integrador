id: practicas-profesionales-proyecto-integrador
slug: practicas-profesionales-proyecto-integrador
title: Prácticas Profesionales - Proyecto Integrador
description_short: 'Proyecto integrador de 3er año: gestión de proyecto, especificación formal (SRS), arquitectura limpia (spec), y defensa. Aplicación práctica de metodologías profesionales a 2 casos reales (energético + institucional).'
description_long: |
  Espacio curricular de cierre de la tecnicatura superior en Ciencia de Datos e Inteligencia Artificial.

  Los estudiantes abordan un proyecto real integrando todos los aprendizajes previos bajo el marco
  **Spec-Driven Development (SDD)**: especificación rigurosa, arquitectura limpia, testing exhaustivo.

  **No es un curso técnico más.** No se enseña OCR (materia 3er año), NLP (materia 2do año),
  ni ML de nuevo (PAA). En su lugar: gestión de proyecto, requisitos formales (SRS),
  arquitectura según spec, integración de tecnologías, metodología Agile, testing, documentación profesional.

  **2 casos reales:**
  1. **Proyecto energético (energy-ml):** Análisis de consumo eléctrico, predicción, gestión
  2. **Proyecto institucional (web):** Portal de estudiantes, gestión académica

  Ambos proyectos siguen **spec** como guía de calidad y arquitectura.

  **Evaluación:** 3 notas parciales (Canvas+SRS, progreso, testing+docs) + defensa oral.
duration: 64 horas de cursada (4 horas semanales × 16 semanas, 2do semestre de 3er año)
level: Avanzado
language: Español
case_study_url_1: https://github.com/datamaq-automation/energy-ml
case_study_title_1: "Caso 1: Sistema de Monitoreo Energético (energy-ml)"
case_study_description_1: "Análisis de consumo eléctrico, NILM, predicción de demanda, gestión de usuarios."
case_study_url_2: https://isftn199.com.ar
case_study_title_2: "Caso 2: Portal Institucional del ISFT N° 199"
case_study_description_2: "Plataforma de gestión académica, atención al alumno, análisis de trayectorias."
spec_reference: https://github.com/datamaq-automation/spec
spec_description: "Framework de arquitectura limpia, requisitos formales, testing exhaustivo (Constraint Gauntlet)"
price: 0.0
og_image: /static/media/cursos/og-practicas-profesionales-proyecto-integrador.webp
og_image_width: 1200
og_image_height: 630
instructor_id: agustin-bustos
academic_only: false
sections:
- id: parte-i
  title: 'Parte I: Definición y Planificación'
  description: Gestión de proyecto, especificación formal, diseño arquitectónico. Semanas 1-8 (32h).
  chapters:
  - id: chap-pp-canvas-1
    title: 'Unidad 1: Canvas y Value Proposition'
    description: "Lean Canvas, identificación de stakeholders, value proposition, scope MVP. Referencia: spec § Business Model Canvas"
    items:
    - type: lesson
      id: les-pp-canvas-1-1
      slug: pp-canvas-problema-solucion
      title: "1.1 Canvas: Problem, Solution, Key Metrics"
      duration: 45 min
      content_file: unidad-1-1-canvas-problema-solucion.md
    - type: lesson
      id: les-pp-canvas-1-2
      slug: pp-canvas-stakeholders-value
      title: "1.2 Identificar stakeholders y value proposition"
      duration: 45 min
      content_file: unidad-1-2-stakeholders-value.md
    - type: lesson
      id: les-pp-canvas-1-3
      slug: pp-canvas-scope-mvp
      title: "1.3 Scope MVP: qué entra, qué no (para esta iteración)"
      duration: 30 min
      content_file: unidad-1-3-scope-mvp.md

  - id: chap-pp-srs-2
    title: 'Unidad 2: Requisitos y Especificación Formal (SRS)'
    description: "Especificación de Requisitos según spec. Requisitos Funcionales (FR), No-Funcionales (NFR), criterios de aceptación, casos de uso."
    items:
    - type: lesson
      id: les-pp-srs-2-1
      slug: pp-srs-requisitos-funcionales
      title: "2.1 Requisitos Funcionales (FR): ¿Qué debe hacer el sistema?"
      duration: 50 min
      content_file: unidad-2-1-requisitos-funcionales.md
    - type: lesson
      id: les-pp-srs-2-2
      slug: pp-srs-requisitos-no-funcionales
      title: "2.2 Requisitos No-Funcionales (NFR): performance, seguridad, escalabilidad"
      duration: 50 min
      content_file: unidad-2-2-requisitos-no-funcionales.md
    - type: lesson
      id: les-pp-srs-2-3
      slug: pp-srs-criterios-casos-uso
      title: "2.3 Criterios de aceptación y casos de uso"
      duration: 40 min
      content_file: unidad-2-3-criterios-casos-uso.md

  - id: chap-pp-arch-3
    title: 'Unidad 3: Arquitectura y Decisiones Técnicas'
    description: "Clean Architecture (spec), evaluación de tecnologías, cuándo usar OCR/NLP/ML, matriz de alternativas, roadmap técnico."
    items:
    - type: lesson
      id: les-pp-arch-3-1
      slug: pp-arch-clean-architecture
      title: "3.1 Clean Architecture: 4 capas, 7 reglas innegociables (spec)"
      duration: 50 min
      content_file: unidad-3-1-clean-architecture.md
    - type: lesson
      id: les-pp-arch-3-2
      slug: pp-arch-evaluacion-tecnologias
      title: "3.2 Evaluación de tecnologías: OCR, NLP, ML, frameworks"
      duration: 50 min
      content_file: unidad-3-2-evaluacion-tecnologias.md
    - type: lesson
      id: les-pp-arch-3-3
      slug: pp-arch-roadmap-tecnico
      title: "3.3 Roadmap técnico: qué se implementa en qué orden"
      duration: 40 min
      content_file: unidad-3-3-roadmap-tecnico.md

  - id: chap-pp-agile-4
    title: 'Unidad 4: Agile, Sprints y Gobernanza'
    description: "Metodología Agile/Scrum, user stories, estimation, planning, Product Backlog, gestión de riesgos. Referencia: spec § Gobernanza."
    items:
    - type: lesson
      id: les-pp-agile-4-1
      slug: pp-agile-scrum-basics
      title: "4.1 Agile y Scrum: sprints, ceremonies, artefactos"
      duration: 45 min
      content_file: unidad-4-1-scrum-basics.md
    - type: lesson
      id: les-pp-agile-4-2
      slug: pp-agile-user-stories
      title: "4.2 User Stories y Planning Poker: estimación de trabajo"
      duration: 45 min
      content_file: unidad-4-2-user-stories.md
    - type: lesson
      id: les-pp-agile-4-3
      slug: pp-agile-product-backlog
      title: "4.3 Product Backlog priorizado y roadmap de sprints"
      duration: 30 min
      content_file: unidad-4-3-product-backlog.md

- id: parte-ii
  title: 'Parte II: Ejecución, Testing y Defensa'
  description: Desarrollo iterativo, testing (Constraint Gauntlet), documentación, defensa. Semanas 9-16 (32h).
  chapters:
  - id: chap-pp-integracion-5a
    title: 'Unidad 5A: Integración Estratégica y Contextualización'
    description: "ANTES de ejecutar: integración de técnicas, trabajo en campo, clima institucional, post-procesamiento. Semana 9."
    items:
    - type: lesson
      id: les-pp-integracion-5a-1
      slug: pp-integracion-tecnicas
      title: "5A.1 Integración de Técnicas: Arquitectura OCR + NLP + ML"
      duration: 50 min
      content_file: unidad-5a-1-integracion-tecnicas.md
    - type: lesson
      id: les-pp-integracion-5a-2
      slug: pp-trabajo-en-campo
      title: "5A.2 Trabajo en Campo: Contextos Reales, Permisos y Seguros"
      duration: 50 min
      content_file: unidad-5a-2-trabajo-en-campo.md
    - type: lesson
      id: les-pp-integracion-5a-3
      slug: pp-clima-institucional
      title: "5A.3 Clima Institucional: Género, Inclusión, Diversidad y Horizontalidad"
      duration: 40 min
      content_file: unidad-5a-3-clima-institucional.md
    - type: lesson
      id: les-pp-integracion-5a-4
      slug: pp-post-procesamiento
      title: "5A.4 Post-procesamiento, Visualización y Mantenimiento: Sostenibilidad"
      duration: 30 min
      content_file: unidad-5a-4-post-procesamiento.md

  - id: chap-pp-exec-5b
    title: 'Unidad 5B: Ejecución Técnica Integrada'
    description: "2 sprints de 2 semanas c/u, aplicando marcos de 5A. Implementación según spec, integración de tecnologías, daily standups, demos."
    items:
    - type: lesson
      id: les-pp-exec-5b-1
      slug: pp-sprint-planning
      title: "5B.1 Sprint Planning: Cómo Estructurar el Sprint"
      duration: 40 min
      content_file: unidad-5b-1-sprint-planning.md
    - type: lesson
      id: les-pp-exec-5b-2
      slug: pp-desarrollo-limpio
      title: "5B.2 Desarrollo Limpio según Spec: Commits Atómicos, PRs, Code Review"
      duration: 50 min
      content_file: unidad-5b-2-desarrollo-limpio.md
    - type: lesson
      id: les-pp-exec-5b-3
      slug: pp-integracion-demo
      title: "5B.3 Integración de Módulos, Testing e Integración y Demo al Equipo"
      duration: 40 min
      content_file: unidad-5b-3-integracion-demo.md

  - id: chap-pp-test-6
    title: 'Unidad 6: Testing y Validación (Constraint Gauntlet)'
    description: "11 baterías de validación según spec: tests, linters, validación de arquitectura, cobertura >= 85%, UAT."
    items:
    - type: lesson
      id: les-pp-test-6-1
      slug: pp-test-gauntlet-overview
      title: "6.1 Constraint Gauntlet: 11 Validaciones según spec"
      duration: 50 min
      content_file: unidad-6-1-gauntlet-overview.md
    - type: lesson
      id: les-pp-test-6-2
      slug: pp-test-unitarios-integracion
      title: "6.2 Tests Unitarios e Integración: pytest con Cobertura >= 85%"
      duration: 50 min
      content_file: unidad-6-2-tests-unitarios.md
    - type: lesson
      id: les-pp-test-6-3
      slug: pp-test-validacion-requisitos
      title: "6.3 Validación de Requisitos: Traceability Matrix y UAT"
      duration: 40 min
      content_file: unidad-6-3-validacion-requisitos.md
    - type: lesson
      id: les-pp-test-6-4
      slug: pp-test-criterios-evaluacion
      title: "6.4 Rúbricas de Evaluación — Criterios Explícitos de Acreditación"
      duration: 40 min
      content_file: unidad-6-criterios-evaluacion-rubrica.md

  - id: chap-pp-docs-7
    title: 'Unidad 7: Documentación y Comunicación Profesional'
    description: "Informe técnico final, README ejecutable, docstrings, storytelling y slides."
    items:
    - type: lesson
      id: les-pp-docs-7-1
      slug: pp-docs-informe-tecnico
      title: "7.1 Informe Técnico Final: Estructura, Metodología y Decisiones"
      duration: 50 min
      content_file: unidad-7-1-informe-tecnico.md
    - type: lesson
      id: les-pp-docs-7-2
