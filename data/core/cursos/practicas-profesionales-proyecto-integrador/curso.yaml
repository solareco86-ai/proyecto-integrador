  - id: chap-pp-visual-2
    title: 'Cap 2: Informes y Documentación'
    description: "Escritura de informes técnicos. Documentación del proyecto. Conclusiones y recomendaciones."
    items:
    - type: lesson
      id: les-pp-visual-2-1
      slug: pp-visual-informe-tecnico
      title: "2.1 Estructura de informe técnico: resumen ejecutivo, metodología, resultados, conclusiones"
