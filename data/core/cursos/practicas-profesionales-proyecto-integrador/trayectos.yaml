trayectos:
- id: trayecto-pp-i
  title: "Trayecto I: Definición y Planificación"
  description: |
    Primer trayecto acumulativo del proyecto integrador.
    Carga: 32 horas (Unidades 1-4).
    Semanas 1-8 del 2do semestre de 3er año.
    Énfasis: Canvas, SRS, Arquitectura, Planificación Agile.
  duration: 32 horas
  weeks: 8
  starting_week: 1
  academic_level: Avanzado
  prerequisites:
    - Procesamiento de Aprendizaje Automático (PAA)
    - Técnicas de Procesamiento Digital de Imágenes (3er año)
    - Técnicas de Procesamiento del Habla (2do año)
  units:
    - trayecto-i
  deliverables:
    - name: "Canvas completo (Lean Canvas)"
      description: "Problem, Solution, Key Metrics, Unfair Advantage, Channels, Revenue Streams, Cost Structure"
      week: 3
      weight: 15
    - name: "SRS (Especificación de Requisitos)"
      description: "5-10 Requisitos Funcionales, 3-5 No-Funcionales, criterios de aceptación, casos de uso"
      week: 5
      weight: 25
    - name: "Arquitectura de alto nivel"
      description: "Diagrama de componentes, decisiones tecnológicas, justificación de stack, referencia a spec"
      week: 6
      weight: 25
    - name: "Product Backlog priorizado"
      description: "20-30 user stories con story points, roadmap de 2 sprints"
      week: 8
      weight: 35
  evaluation_criteria:
    - Claridad del problema y value proposition
    - Completitud y rigor de SRS
    - Coherencia arquitectónica con spec
    - Planificación realista (story points, velocidad estimada)
    - Documentación de decisiones

- id: trayecto-pp-ii
  title: "Trayecto II: Ejecución, Testing y Defensa"
  description: |
    Segundo trayecto acumulativo del proyecto integrador.
    Carga: 32 horas (Unidades 5-8).
    Semanas 9-16 del 2do semestre de 3er año.
    Énfasis: Sprints, Testing (Constraint Gauntlet), Documentación, Defensa oral.
  duration: 32 horas
  weeks: 8
  starting_week: 9
  academic_level: Avanzado
  prerequisites:
    - Trayecto I (este curso)
    - Prerequisitos de Trayecto I
  units:
    - trayecto-ii
  deliverables:
    - name: "Integración Estratégica: Trabajo en Campo + Documentación"
      description: "Visita a contexto real, acta de visita, learning logs, actualización de SRS/Backlog basada en realidad"
      week: 9
      weight: 15
    - name: "Código implementado (2 sprints)"
      description: "Features funcionales en repositorio Git, commits atómicos, seguidor spec, OCR+NLP+ML integrados"
      week: 13
      weight: 25
    - name: "Test suite y validación de requisitos"
      description: "Tests unitarios >= 85% cobertura, tests integración, validación de cada FR/NFR, métricas de monitoreo"
      week: 14
      weight: 25
    - name: "Informe Técnico Final"
      description: "10-15 páginas: resumen, metodología, arquitectura, decisiones, resultados, lecciones aprendidas, reflexión social"
      week: 15
      weight: 20
    - name: "Presentación y Defensa oral"
      description: "20-30 min frente a partes interesadas, Q&A, demo en vivo, reflexión crítica sobre fortalezas/debilidades"
      week: 16
      weight: 15
  evaluation_criteria:
    - Implementación de funcionalidades (FR operacionales)
    - Cumplimiento de NFR (seguridad, performance, escalabilidad)
    - Cobertura de tests y validación exhaustiva
    - Claridad de comunicación (informe, presentación)
    - Respuesta a preguntas y pensamiento crítico
    - Integración de tecnologías (OCR, NLP, ML si aplica)
    - Adhesión a spec (arquitectura, código limpio, tipo exhaustivo)

evaluation_strategy: |
  **Estrategia General de Evaluación**

  El proyecto se evalúa en 2 fases acumulativas con 3 notas parciales + 1 nota final:

  1. **Parcial I (Semana 8, Trayecto I):** Entrega de Canvas + SRS + Arquitectura + Backlog
     Peso: 25% de nota final

  2. **Parcial II (Semana 12, Trayecto II):** Sprint reviews (funcionalidad demostrable) + Informe de progreso
     Peso: 25% de nota final

  3. **Parcial III (Semana 15, Trayecto II):** Código + Testing + Documentación técnica
     Peso: 25% de nota final

  4. **Defensa Final (Semana 16, Trayecto II):** Presentación oral + Q&A frente a partes interesadas
     Peso: 25% de nota final

  **NOTA FINAL = (Parcial I + Parcial II + Parcial III + Defensa) / 4**

  **Criterios transversales (en todos los parciales):**
  - Rigor metodológico: ¿Siguen proceso (spec, SRS, test-driven)?
  - Integración de tecnologías: ¿Usan OCR, NLP, ML coherentemente?
  - Documentación: ¿Decisiones justificadas, código legible, specs claros?
  - Trabajo en equipo: ¿Contribuciones individuales visibles en Git?
  - Pensamiento crítico: ¿Reflexionan sobre alternativas y limitaciones?

grading_rubric:
  - criterion: "Rigor Metodológico y Especificación"
    weight: 20
    levels:
      - score: 90-100
        description: "SRS completo, Canvas detallado, decisiones justificadas, referencias a spec consistentes"
      - score: 75-89
        description: "SRS y Canvas presentes, decisiones mayormente justificadas, referencias a spec"
      - score: 60-74
        description: "SRS y Canvas básicos, decisiones implícitas, poco detalle"
      - score: 0-59
        description: "SRS incompleto, Canvas superficial, sin justificación"

  - criterion: "Implementación y Arquitectura (Clean Architecture, spec)"
    weight: 25
    levels:
      - score: 90-100
        description: "Código limpio, tipado exhaustivo, 4 capas respetadas, tests > 85%, commits atómicos"
      - score: 75-89
        description: "Código funcional, mayormente tipado, capas presentes, tests > 70%, commits limpios"
      - score: 60-74
        description: "Código funcional, tipado parcial, capas básicas, tests > 50%"
      - score: 0-59
        description: "Código con problemas, sin tipos, capas violadas, tests < 50%"

  - criterion: "Integración de Tecnologías (OCR/NLP/ML)"
    weight: 20
    levels:
      - score: 90-100
        description: "Decisiones técnicas coherentes, alternativas evaluadas, integración limpia, justificación clara"
      - score: 75-89
        description: "Decisiones técnicas sensatas, integración funcional, justificación presente"
      - score: 60-74
        description: "Decisiones básicas, integración presente pero sin optimizar"
      - score: 0-59
        description: "Decisiones ad-hoc, integración frágil o inexistente"

  - criterion: "Documentación y Comunicación"
    weight: 20
    levels:
      - score: 90-100
        description: "Informe detallado, README claro, docstrings completos, presentación fluida y convincente"
      - score: 75-89
        description: "Informe completo, README adecuado, docstrings presentes, presentación competente"
      - score: 60-74
        description: "Informe presente, README básico, docstrings parciales, presentación aceptable"
      - score: 0-59
        description: "Documentación insuficiente, presentación confusa"

  - criterion: "Pensamiento Crítico y Reflexión"
    weight: 15
    levels:
      - score: 90-100
        description: "Reflexión sobre alternativas, limitaciones reconocidas, mejoras identificadas, respuesta sólida a Q&A"
      - score: 75-89
        description: "Reflexión presente, algunas limitaciones reconocidas, respuesta adecuada a preguntas"
      - score: 60-74
        description: "Reflexión básica, limitaciones mencionadas, respuestas superficiales"
      - score: 0-59
        description: "Sin reflexión crítica, respuestas débiles o evasivas"
