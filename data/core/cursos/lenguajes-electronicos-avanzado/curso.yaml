id: "lenguajes-electronicos-avanzado"
slug: "lenguajes-electronicos-avanzado"
title: "Lenguajes Electrónicos: Nivel Avanzado"
description_short: "Proyecto integrador Pac-Man en ESP32-WROOM y OLED: arquitectura limpia, DDD y puertos con adaptadores pygame/machine."
description_long: "Este es el nivel culminante del vertical Lenguajes Electrónicos y su proyecto integrador: un videojuego Pac-Man que se ejecuta en un ESP32-WROOM y se dibuja en una pantalla OLED de 128x64 por I2C. Antes de programar, vas a interiorizar los fundamentos de la arquitectura limpia y del Domain-Driven Design (DDD): la regla de dependencia (las capas externas dependen del dominio, nunca al revés), el lenguaje ubicuo del juego, las Entidades, los Value Objects y los Servicios de dominio, y el patrón puertos y adaptadores (arquitectura hexagonal) que permite correr el mismo juego en la PC con pygame y en el microcontrolador con el módulo machine. Luego construís el juego completo: entidades y movimiento de Pac-Man, IA básica de los fantasmas, detección de colisiones, capa de aplicación con bucle principal y puntuación, el renderizador OLED y el flasheo para ejecución autónoma. Un curso que combina electrónica, programación y diseño de software profesional."
duration: "24 horas de cursada"
level: "Avanzado"
language: "Español"
price: 0.0
instructor_id: "agustin-bustos"
academic_only: true
sections:
  # --- SECCIÓN A ---
  - id: "sec-leng-av-a"
    title: "Sección A: Arquitectura Limpia y DDD"
    description: "Regla de dependencia, modelado del dominio del juego con DDD y puertos con adaptadores."
    chapters:
      - id: "chap-leng-av-1"
        title: "Cap 1: Arquitectura Limpia"
        description: "Capas, regla de dependencia y un dominio que no conoce a la infraestructura."
        items:
          - type: "lesson"
            id: "les-leng-av-1-1"
            slug: "arquitectura-limpia-regla-dependencia"
            title: "1.1 Arquitectura limpia que grita: capas y regla de dependencia"
            duration: "55 min"
            content_file: "cap-1-1-arquitectura-limpia-regla-dependencia.md"

      - id: "chap-leng-av-2"
        title: "Cap 2: Modelado del Dominio con DDD"
        description: "Lenguaje ubicuo, entidades, value objects, agregados y servicios de dominio del juego."
        items:
          - type: "lesson"
            id: "les-leng-av-2-1"
            slug: "ddd-modelado-dominio-pacman"
            title: "2.1 Modelado del dominio con DDD: entidades, value objects y servicios"
            duration: "60 min"
