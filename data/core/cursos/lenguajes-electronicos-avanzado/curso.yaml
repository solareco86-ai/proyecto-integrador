      - id: "chap-eval-leng-av-final"
        title: "Evaluación Final"
        description: "Validá tus conocimientos del proyecto integrador, la arquitectura limpia y DDD."
        items:
          - type: "quiz"
            id: "quiz-leng-av-final"
            slug: "evaluacion-proyecto-pacman"
            title: "Cuestionario: Proyecto Pac-Man, Arquitectura Limpia y DDD"
            duration: "25 min"
            questions:
              - id: "q-leng-fantasma"
                question: "¿Qué estrategia de IA básica para fantasmas se utiliza en el proyecto Pac-Man?"
                type: "single_choice"
                options:
                  - "Elegir siempre la dirección opuesta a la actual"
                  - "Elegir direcciones válidas al azar en las intersecciones, con una probabilidad de perseguir a Pac-Man acortando la distancia"
                  - "Recorrer siempre el camino más largo"
                correct_option: 1
                explanation: "En cada intersección el fantasma elige entre las direcciones válidas, con una probabilidad de preferir las que acortan la distancia hacia Pac-Man."
              - id: "q-leng-scope-var"
                question: "En MicroPython, una variable definida dentro de una función solo es reconocida por esa función y se denomina variable local."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "Las variables locales solo tienen validez dentro de la función donde se declaran; las globales, definidas fuera de todas las funciones, pueden ser usadas por cualquiera."
              - id: "q-leng-bucle"
                question: "El bucle principal del juego (game loop) se ejecuta repetidamente mientras dura la partida. ¿Qué estructura de MicroPython se usa típicamente?"
                type: "single_choice"
                options:
                  - "while True:"
                  - "if True:"
                  - "for i in range(1):"
                correct_option: 0
                explanation: "Un while True: crea un bucle infinito que se repite hasta que una condición interna (game over o victoria) rompa la ejecución."
              - id: "q-leng-framebuffer"
                question: "En el renderizador OLED, el framebuffer se dibuja en memoria y luego se envía completo a la pantalla para evitar parpadeos."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "Dibujar sobre un buffer y volcarlo de una vez con show() evita que la pantalla muestre estados intermedios y produce una imagen estable."
              - id: "q-leng-puerto-control"
                question: "¿Qué puerto (interfaz) define el dominio del juego para recibir la dirección elegida por el jugador sin conocer pygame ni el hardware?"
                type: "single_choice"
                options:
                  - "Una interfaz Controlador que el dominio implementa"
                  - "Un puerto de entrada de comandos, implementado por adaptadores (teclado en PC o pulsadores en ESP32)"
                  - "Una función interna de la entidad PacMan"
                correct_option: 1
                explanation: "El dominio declara el contrato de entrada (puerto) y los adaptadores de infraestructura (teclado pygame o pulsadores del ESP32) lo implementan e inyectan hacia adentro."
