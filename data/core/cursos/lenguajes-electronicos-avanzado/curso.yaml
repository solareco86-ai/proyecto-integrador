      - id: "chap-eval-leng-av-a"
        title: "Evaluación de la Sección A"
        description: "Comprobá tus conocimientos de arquitectura limpia y DDD."
        items:
          - type: "quiz"
            id: "quiz-leng-av-a"
            slug: "cuestionario-arquitectura-ddd"
            title: "Cuestionario: Arquitectura Limpia y DDD"
            duration: "20 min"
            questions:
              - id: "q-leng-regla-dependencia"
                question: "La regla de dependencia de la arquitectura limpia establece que las dependencias del código fuente deben apuntar siempre:"
                type: "single_choice"
                options:
                  - "Desde el dominio hacia la infraestructura"
                  - "Desde las capas externas hacia el dominio"
                  - "En ambas direcciones sin restricciones"
                correct_option: 1
                explanation: "Las dependencias deben apuntar hacia adentro: la infraestructura (pygame, machine) depende del dominio, pero el dominio no conoce ni importa nada de la infraestructura."
              - id: "q-leng-entidades"
                question: "En DDD, una Entidad se caracteriza por tener una identidad propia que se mantiene a lo largo del tiempo, a diferencia de un Value Object que se define por sus atributos."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "Las Entidades (como PacMan o un fantasma) tienen identidad y ciclo de vida; los Value Objects (como una Posicion o un Puntaje) son inmutables y se comparan por su valor."
              - id: "q-leng-puerto"
                question: "En el patrón puertos y adaptadores, el renderizador del juego es:"
                type: "single_choice"
                options:
                  - "Un adaptador concreto que el dominio importa directamente"
                  - "Un puerto (contrato) definido en el dominio, con adaptadores pygame y machine que lo implementan"
                  - "Una librería de terceros obligatoria"
                correct_option: 1
                explanation: "El puerto es un contrato definido en el dominio; los adaptadores (pygame en PC y machine+OLED en ESP32) implementan ese contrato y se inyectan desde fuera."
              - id: "q-leng-lenguaje-ubicuo"
                question: "El lenguaje ubicuo en DDD es un vocabulario común y compartido entre el equipo técnico y el dominio del negocio, sin ambigüedades."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "El lenguaje ubicuo es central en DDD: todos usan los mismos términos (bolita, fantasma, laberinto) en el código, el diseño y la conversación."

