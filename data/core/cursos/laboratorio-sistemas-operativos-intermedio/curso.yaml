        items:
          - type: "quiz"
            id: "quiz-lso-int-c"
            slug: "cuestionario-impresion-drivers-fuentes"
            title: "Cuestionario: Impresión, Tipografías y Panel de Control"
            duration: "20 min"
            questions:
              - id: "q-lso-int-spool"
                question: "¿Qué ventaja brinda la impresión en diferido (spool)?"
                type: "single_choice"
                options:
                  - "Libera al programa de esperar a que la impresora termine de imprimir"
                  - "Imprime más rápido físicamente"
                  - "Convierte archivos a PDF"
                  - "Reduce el consumo de tinta"
                correct_option: 0
                explanation: "Con el spool el documento se encola y la aplicación sigue trabajando; el administrador de impresión gestiona la cola."
              - id: "q-lso-int-driver"
                question: "Un controlador (driver) es un software que permite que el sistema operativo se comunique con un dispositivo de hardware."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "El driver traduce las órdenes del sistema operativo al lenguaje del dispositivo (impresora, placa de red, etc.)."
              - id: "q-lso-int-font"
                question: "¿Cuál de los siguientes es un formato de tipografía que se instala normalmente en el sistema?"
                type: "single_choice"
                options:
                  - "TrueType (.ttf) u OpenType (.otf)"
                  - ".mp4"
                  - ".jpeg"
                  - ".py"
                correct_option: 0
                explanation: "Las tipografías TrueType y OpenType se instalan en el sistema y las aplicaciones las utilizan para dibujar el texto."
