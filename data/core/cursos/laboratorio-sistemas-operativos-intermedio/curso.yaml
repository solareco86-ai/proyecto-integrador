          - type: "lesson"
            id: "les-lso-int-3-2"
            slug: "memoria-virtual-swapping"
            title: "3.2 Memoria virtual y swapping (free, vmstat, swapon)"
            duration: "50 min"
            content_file: "cap-3-2-memoria-virtual-swapping.md"

      - id: "chap-lso-int-4"
        title: "Cap 4: Procesos y multiprocesamiento"
        description: "Concepto de proceso, prioridades y esquemas de ejecución, herramientas de diagnóstico y líneas de ejecución paralelas."
        items:
          - type: "lesson"
            id: "les-lso-int-4-1"
            slug: "concepto-proceso-prioridades"
            title: "4.1 Concepto de proceso, prioridades y esquemas de ejecución"
            duration: "45 min"
            content_file: "cap-4-1-concepto-proceso-prioridades.md"
          - type: "lesson"
            id: "les-lso-int-4-2"
            slug: "diagnostico-prioridades-nice-renice"
            title: "4.2 Herramientas de diagnóstico y alteración de prioridades (ps, top, htop, nice, renice)"
            duration: "55 min"
            content_file: "cap-4-2-diagnostico-prioridades-nice-renice.md"
          - type: "lesson"
            id: "les-lso-int-4-3"
            slug: "multiprocesamiento-hilos"
            title: "4.3 Líneas de ejecución paralelas y múltiples procesadores"
            duration: "50 min"
            content_file: "cap-4-3-multiprocesamiento-hilos.md"

      - id: "chap-eval-lso-int-b"
        title: "Evaluación de la Sección B"
        description: "Comprobá tus conocimientos sobre memoria, procesos, prioridades y multiprocesamiento."
        items:
          - type: "quiz"
            id: "quiz-lso-int-b"
            slug: "cuestionario-memoria-procesos"
            title: "Cuestionario: Memoria y Procesos"
            duration: "20 min"
            questions:
              - id: "q-lso-int-swap"
                question: "¿Qué es el swapping?"
                type: "single_choice"
                options:
                  - "Mover páginas de memoria entre la RAM y el área de intercambio (swap)"
                  - "Borrar archivos del disco"
                  - "Imprimir documentos en diferido"
                  - "Renombrar procesos"
                correct_option: 0
                explanation: "El swapping traslada páginas de memoria al espacio de intercambio en disco cuando la RAM se agota, lo que puede frenar la ejecución."
              - id: "q-lso-int-pid"
                question: "¿Qué representa el PID de un proceso?"
                type: "single_choice"
                options:
                  - "El identificador único del proceso en el sistema"
                  - "El tamaño del proceso en memoria"
                  - "La prioridad del proceso"
                  - "El usuario propietario del proceso"
                correct_option: 0
                explanation: "PID (Process ID) es un número único que identifica a cada proceso mientras está en ejecución."
              - id: "q-lso-int-nice"
                question: "El comando renice permite cambiar la prioridad de ejecución de un proceso ya lanzado."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "renice ajusta el valor de prioridad (nice value) de un proceso en ejecución; con nice se establece al lanzarlo."

