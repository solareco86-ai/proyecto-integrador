id: "laboratorio-sistemas-operativos-intermedio"
slug: "laboratorio-sistemas-operativos-intermedio"
title: "Laboratorio de Sistemas Operativos: Nivel Intermedio"
description_short: "Núcleo, interrupciones y llamadas al sistema; sistemas de archivos y E/S; memoria real y virtual; procesos, prioridades y multiprocesamiento; impresión diferida, drivers y tipografías."
description_long: "Este es el segundo nivel del vertical Laboratorio de Sistemas Operativos, basado en Debian con escritorio XFCE y con un enfoque de laboratorio. Profundizarás en el núcleo del sistema: las interrupciones y las llamadas al sistema, y su utilidad ante situaciones de error. Aprenderás a administrar sistemas de archivos y montajes, y a trabajar con entrada/salida usando redireccionamiento y tuberías. Luego explorarás la administración de la memoria real y virtual, el problema del swapping y su efecto sobre la velocidad de ejecución. Estudiarás el concepto de proceso, las prioridades y los esquemas de ejecución, y cómo alterarlas con herramientas como ps, top, nice y renice, incluyendo líneas de ejecución paralelas con múltiples procesadores. Finalmente trabajarás con la impresión diferida al procesamiento (spool y CUPS), la administración de varias impresoras, los controladores (drivers), las tipografías y el panel de control. Se recomienda haber completado el nivel Inicial."
duration: "48 horas de cursada"
level: "Intermedio"
language: "Español"
price: 0.0
og_image: "/static/media/cursos/og-laboratorio-sistemas-operativos-intermedio.webp"
og_image_width: 1200
og_image_height: 630
instructor_id: "agustin-bustos"
academic_only: true
sections:
  # --- SECCIÓN A ---
  - id: "sec-lso-int-a"
    title: "Sección A: El Núcleo y la Entrada/Salida"
    description: "Núcleo, interrupciones y llamadas al sistema; sistemas de archivos y montaje; entrada/salida con redireccionamiento y tuberías."
    chapters:
      - id: "chap-lso-int-1"
        title: "Cap 1: Núcleo, interrupciones y llamadas al sistema"
        description: "El núcleo del sistema operativo, las interrupciones y las llamadas al sistema, y su utilidad en situaciones de error."
        items:
          - type: "lesson"
            id: "les-lso-int-1-1"
            slug: "nucleo-utilidad-errores"
            title: "1.1 El núcleo del SO y su utilidad ante situaciones de error"
            duration: "45 min"
            content_file: "cap-1-1-nucleo-utilidad-errores.md"
          - type: "lesson"
            id: "les-lso-int-1-2"
            slug: "llamadas-sistema-strace"
            title: "1.2 Llamadas al sistema y syscalls en la práctica (strace)"
            duration: "50 min"
            content_file: "cap-1-2-llamadas-sistema-strace.md"

      - id: "chap-lso-int-2"
        title: "Cap 2: Manejo de archivos y de entrada/salida"
        description: "Sistemas de archivos y montaje en la práctica, redireccionamiento y tuberías."
        items:
          - type: "lesson"
            id: "les-lso-int-2-1"
            slug: "sistemas-archivos-montaje"
            title: "2.1 Sistemas de archivos y montaje en la práctica"
            duration: "50 min"
            content_file: "cap-2-1-sistemas-archivos-montaje.md"
          - type: "lesson"
            id: "les-lso-int-2-2"
            slug: "entrada-salida-redireccionamiento-tuberias"
            title: "2.2 Entrada/salida, redireccionamiento y tuberías"
            duration: "50 min"
            content_file: "cap-2-2-entrada-salida-redireccionamiento-tuberias.md"

      - id: "chap-eval-lso-int-a"
        title: "Evaluación de la Sección A"
        description: "Comprobá tus conocimientos sobre el núcleo, las llamadas al sistema, los sistemas de archivos y la E/S."
        items:
          - type: "quiz"
            id: "quiz-lso-int-a"
            slug: "cuestionario-nucleo-es-io"
            title: "Cuestionario: El Núcleo y la Entrada/Salida"
            duration: "20 min"
            questions:
              - id: "q-lso-int-syscall"
                question: "¿Qué es una llamada al sistema (syscall)?"
                type: "single_choice"
                options:
                  - "El mecanismo por el cual un programa de usuario solicita un servicio al núcleo"
                  - "Un virus informático"
                  - "Un tipo de tipografía"
                  - "Un comando para borrar archivos"
                correct_option: 0
                explanation: "Las syscalls son la interface entre los programas de usuario y el núcleo: leen archivos, crean procesos, gestionan memoria, etc."
              - id: "q-lso-int-interrupcion"
                question: "Una interrupción es una señal que avisa al procesador de un evento que requiere atención inmediata."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "Las interrupciones (de hardware o software) suspenden la tarea en curso para que el núcleo atienda el evento y luego retome la ejecución."
              - id: "q-lso-int-tuberia"
                question: "¿Qué hace el operador | (tubería) en la terminal?"
                type: "single_choice"
                options:
                  - "Envía la salida de un comando como entrada del siguiente"
                  - "Borra la salida de un comando"
                  - "Cierra la terminal"
                  - "Duplica archivos"
                correct_option: 0
                explanation: "La tubería conecta la salida estándar de un comando con la entrada estándar del siguiente, permitiendo encadenar comandos."

  # --- SECCIÓN B ---
  - id: "sec-lso-int-b"
