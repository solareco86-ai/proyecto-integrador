id: "electronica-industrial-inicial"
slug: "electronica-industrial-inicial"
title: "Electrónica Industrial: Nivel Inicial"
description_short: "Automatización industrial, sistemas de control lógicos (PLC), análisis de circuitos electrónicos, regulación automática (PID), interpretación de planos y fundamentos de robótica."
description_long: "Este es el primer nivel del vertical Electrónica Industrial. Aprenderás los fundamentos de la automatización industrial: desde qué significa automatizar un proceso productivo y la pirámide CIM, hasta los sistemas de control lógicos basados en relés, contactores y PLC, con su arquitectura interna, ciclo de scan y operadores lógicos. Analizarás circuitos electrónicos desde el enfoque funcional-estructural (bloques y funciones), los tipos de circuitos analógicos, digitales y de potencia, los sensores y transductores con su acondicionamiento de señal, y los actuadores industriales. Luego abordarás la regulación automática y la técnica de control: variables de proceso, consigna y perturbación, control todo-nada, proporcional y PID, aplicados a la automatización. Cerrarás interpretando planos de equipos de electrónica industrial (simbología IEC/ANSI, circuitos de mando y fuerza, diagramas de bloques y layout de tableros) y con una introducción a la robótica industrial: tipos, componentes y aplicaciones. No se requieren conocimientos previos de programación."
duration: "48 horas de cursada"
level: "Inicial"
language: "Español"
price: 0.0
