      - id: "chap-opencode-int-cap-5"
        title: "Evaluación de la Sección B"
        description: "Validá tus conocimientos adquiridos en el curso."
        items:
          - type: "quiz"
            id: "quiz-opencode-intermedio"
            slug: "evaluacion-opencode-intermedio"
            title: "Cuestionario: Desarrollo Asistido por IA con OpenCode"
            duration: "10 min"
            questions:
              - id: "q-int-plan"
                question: "¿Qué representa el Modo Plan en OpenCode?"
                type: "single_choice"
                options:
                  - "Escribir código de forma inmediata"
                  - "Analizar el problema y diseñar la solución antes de escribir código"
                  - "Ejecutar los tests automáticamente"
                  - "Desplegar la aplicación a producción"
                correct_option: 1
                explanation: "El Modo Plan se enfoca en razonar el problema, explorar el contexto y proponer una estrategia de implementación antes de tocar el código, reduciendo errores en la fase Build."
              - id: "q-int-tab"
                question: "La tecla Tab en la TUI de OpenCode permite autocompletar y seleccionar comandos sugeridos por la IA."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "La tecla Tab activa el autocompletado de comandos y sugerencias, acelerando la interacción con el agente y evitando errores de escritura."
              - id: "q-int-agents"
                question: "¿Cuál es la función principal de un archivo AGENTS.md en un repositorio?"
                type: "single_choice"
                options:
                  - "Definir el esquema de la base de datos"
                  - "Proveer contexto e instrucciones al agente de IA sobre el repositorio"
                  - "Generar automáticamente la documentación del proyecto"
                  - "Configurar el despliegue en producción"
                correct_option: 1
                explanation: "AGENTS.md actúa como memoria de contexto: informa al agente sobre la arquitectura, las convenciones y los comandos de validación del repositorio para que sus cambios sean consistentes."
