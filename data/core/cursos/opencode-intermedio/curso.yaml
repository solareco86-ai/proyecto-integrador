id: "opencode-intermedio"
slug: "opencode-intermedio"
title: "Desarrollo Asistido por IA con OpenCode"
description_short: "Aprendé a desarrollar con agentes de IA usando OpenCode: CLI/TUI, tecla Tab, Modo Plan vs Build y directivas AGENTS.md."
description_long: "Este curso práctico e interactivo te introduce al desarrollo asistido por agentes de IA con OpenCode. Aprenderás desde la instalación y configuración inicial de la CLI hasta el manejo fluido de su interfaz TUI, el uso del autocompletado con la tecla Tab, y la diferencia fundamental entre el Modo Plan y el Modo Build. También dominarás la gestión de contexto local del proyecto mediante AGENTS.md y directivas de repositorio, permitiéndote construir soluciones de ciencia de datos e inteligencia artificial de forma más rápida, consistente y verificable. Prerrequisitos recomendados: conocimientos básicos de Python, uso básico de la terminal y nociones de Git."
duration: "7 horas"
level: "Intermedio"
language: "Español"
price: 0.0
