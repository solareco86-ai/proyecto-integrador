id: "procesamiento-aprendizaje-automatico-avanzado"
slug: "procesamiento-aprendizaje-automatico-avanzado"
title: "Procesamiento de Aprendizaje Automático: Nivel Avanzado"
description_short: "Razonamiento simbólico, reglas inductivas (AQ, FOIL), árboles de decisión (CART), análisis de AST y creación de servidores MCP en FastAPI para agentes autónomos."
description_long: "En este nivel avanzado de la cátedra Procesamiento de Aprendizaje Automático, profundizarás en los fundamentos del aprendizaje simbólico, la inferencia basada en reglas lógicas y la integración directa con agentes autónomos de software. Dominarás el formalismo del Espacio de Versiones mediante el algoritmo Candidate-Elimination, los algoritmos de recubrimiento secuencial (AQ) y la Programación Lógica Inductiva (FOIL). Implementarás árboles de decisión y regresión (CART) analizando entropía, ganancia de información y métricas de impureza de Gini, serializando las trazas de decisión en JSON para su trazabilidad y explicabilidad. Finalmente, aprenderás cómo los agentes modernos (AGY, OpenCode y Aider) leen y podan el código a través de Árboles de Sintaxis Abstracta (AST) y desarrollarás servidores bajo el protocolo MCP (Model Context Protocol) en FastAPI para permitir que agentes de IA ejecuten predicciones, auditen reglas y resuelvan tareas complejas de forma autónoma. Modalidad 100% práctica de aula-taller."
duration: "24 horas de cursada"
level: "Avanzado"
language: "Español"
