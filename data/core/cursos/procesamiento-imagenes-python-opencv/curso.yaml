            content_file: "cap-2-2-histogramas-umbralizacion-bordes-canny.md"

      - id: "chap-pdi-cap-3"
        title: "Evaluación Final"
        description: "Evaluación técnica integradora sobre conceptos de procesamiento digital de imágenes con OpenCV."
        items:
          - type: "quiz"
            id: "quiz-procesamiento-imagenes-opencv"
            slug: "evaluacion-procesamiento-imagenes-opencv"
            title: "Cuestionario Integrador: Procesamiento Digital de Imágenes"
            duration: "15 min"
            questions:
              - id: "q-opencv-bgr"
                question: "¿En qué orden almacena OpenCV por defecto los canales de color al cargar una imagen con cv2.imread()?"
                type: "single_choice"
                options:
                  - "RGB (Red, Green, Blue)"
                  - "BGR (Blue, Green, Red)"
                  - "HSV (Hue, Saturation, Value)"
                  - "CMYK (Cyan, Magenta, Yellow, Black)"
                correct_option: 1
                explanation: "Por razones históricas de diseño de hardware informático, OpenCV carga por defecto los canales en orden BGR (Azul, Verde, Rojo)."

              - id: "q-opencv-median"
                question: "¿Cuál es el filtro espacial más recomendado para eliminar el ruido de tipo 'sal y pimienta' sin desenfocar destructivamente los bordes?"
                type: "single_choice"
                options:
                  - "Filtro Gaussiano (cv2.GaussianBlur)"
                  - "Filtro de Mediana (cv2.medianBlur)"
                  - "Filtro Promedio (cv2.blur)"
                  - "Filtro Sobel (cv2.Sobel)"
                correct_option: 1
                explanation: "El filtro de mediana reemplaza cada píxel por la mediana de sus vecinos, eliminado eficazmente valores atípicos extremos como los del ruido sal y pimienta."

              - id: "q-opencv-canny"
                question: "El algoritmo Canny de detección de bordes requiere convertir la imagen a escala de grises y aplicar suavizado previo para evitar falsos positivos."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "Verdadero. Canny opera sobre gradientes de intensidad monocromáticos y un suavizado gaussiano previo elimina el ruido de alta frecuencia que distorsionaría la detección de bordes."
