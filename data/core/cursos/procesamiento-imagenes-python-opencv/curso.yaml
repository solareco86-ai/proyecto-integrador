id: "procesamiento-imagenes-python-opencv"
slug: "procesamiento-imagenes-python-opencv"
title: "Técnicas de Procesamiento Digital de Imágenes con Python y OpenCV"
description_short: "Domina el procesamiento digital de imágenes con OpenCV y Python: transformaciones, filtrado espacial, histogramas, bordes y segmentación."
description_long: "Este curso práctico introduce a estudiantes y profesionales de Ciencia de Datos, Inteligencia Artificial y Mecatrónica al procesamiento digital de imágenes utilizando Python y OpenCV. A lo largo del curso aprenderás la fundamentación matemática de las imágenes digitales como matrices numéricas, las técnicas esenciales de conversión entre espacios de color (BGR, RGB, HSV, escala de grises), transformaciones geométricas (escalado, rotación, traslación) y operaciones de filtrado espacial para reducción de ruido. Además, dominarás el cálculo e igualación de histogramas, algoritmos de umbralización como el método de Otsu, y detectores de bordes fundamentales como Sobel y Canny. Es una base imprescindible antes de encarar proyectos avanzados de visión por computadora y aprendizaje profundo (Deep Learning/CNNs)."
duration: "20 horas de cursada"
level: "Intermedio"
language: "Español"
price: 0.0
