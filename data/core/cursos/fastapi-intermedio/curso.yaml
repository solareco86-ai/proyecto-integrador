      - id: "chap-int-cap-5"
        title: "Evaluación Final"
        description: "Validá tus conocimientos adquiridos en el curso."
        items:
          - type: "quiz"
            id: "quiz-fastapi-intermedio"
            slug: "evaluacion-fastapi-intermedio"
            title: "Cuestionario: Desarrollo de APIs con FastAPI y Python"
            duration: "10 min"
            questions:
              - id: "q-hints"
                question: "¿Cuál de las siguientes es una característica que FastAPI utiliza para realizar validación automática de datos en tiempo de ejecución?"
                type: "single_choice"
                options:
                  - "Uvicorn"
                  - "Type Hints (Anotaciones de tipo de Python)"
                  - "Jinja2"
                correct_option: 1
                explanation: "FastAPI aprovecha las anotaciones de tipo nativas de Python para realizar la validación automática mediante Pydantic."
              - id: "q-async"
                question: "FastAPI permite definir endpoints asíncronos utilizando async def para operaciones de entrada/salida no bloqueantes."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "El uso de async def en FastAPI permite ejecutar llamadas de entrada/salida (I/O) no bloqueantes en el event loop principal."
              - id: "q-depends"
                question: "¿Qué función de FastAPI se utiliza para implementar el patrón de Inyección de Dependencias?"
                type: "single_choice"
                options:
                  - "Inject"
                  - "Depends"
                  - "Provide"
                  - "UseService"
                correct_option: 1
                explanation: "La función Depends() de FastAPI permite declarar dependencias en las firmas de los endpoints para modularizar la lógica de negocio."
              - id: "q-status-422"
                question: "¿Qué código de estado HTTP devuelve automáticamente FastAPI cuando los datos de la petición no cumplen con la estructura esperada por el schema Pydantic?"
                type: "single_choice"
                options:
                  - "400 Bad Request"
                  - "404 Not Found"
                  - "422 Unprocessable Entity"
                  - "500 Internal Server Error"
                correct_option: 2
                explanation: "FastAPI retorna un estado HTTP 422 (Unprocessable Entity) acompañado por una lista detallada en JSON indicando cada uno de los campos que fallaron la validación."
              - id: "q-uvicorn-reload"
                question: "¿Qué opción se pasa al comando 'uvicorn' para habilitar el reinicio automático del servidor cuando se guardan cambios en el código?"
                type: "single_choice"
                options:
                  - "--watch"
                  - "--reload"
                  - "--live"
                  - "--restart"
                correct_option: 1
                explanation: "La bandera '--reload' indica a Uvicorn que monitoree los archivos del proyecto y reinicie el servidor de desarrollo al detectar modificaciones."
