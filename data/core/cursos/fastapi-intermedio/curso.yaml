id: "fastapi-intermedio"
slug: "fastapi-intermedio"
title: "Desarrollo de APIs con FastAPI y Python"
description_short: "Desarrollá APIs REST con Python y FastAPI: entorno, programación, endpoints, modelos Pydantic e inyección de dependencias."
description_long: "Este curso práctico te introduce al desarrollo de APIs REST modernas con Python y FastAPI. Aprenderás a configurar el entorno de desarrollo (pyenv, venv y pip), a programar con buenas prácticas en Python (funciones, POO, type hints con Mypy y operaciones asíncronas), y a construir endpoints REST con manejo de parámetros, personalización de respuestas y estructuración modular con APIRouter. También dominarás la validación de datos con modelos Pydantic y el patrón de inyección de dependencias, base para aplicaciones escalables y testables. Prerrequisitos recomendados: haber completado el curso Python y Entorno para Ciencia de Datos, o contar con conocimientos básicos de Python, entornos virtuales y conceptos generales de HTTP."
duration: "20 horas de cursada"
level: "Intermedio"
language: "Español"
price: 0.0
