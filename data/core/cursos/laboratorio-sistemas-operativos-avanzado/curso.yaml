            duration: "50 min"
            content_file: "cap-5-1-sistemas-abiertos-vs-propietarios.md"
          - type: "lesson"
            id: "les-lso-avz-5-2"
            slug: "nucleo-modularidad-bibliotecas"
            title: "5.2 Núcleo, modularidad, bibliotecas compartidas (dll y .so) y compatibilidad"
            duration: "50 min"
            content_file: "cap-5-2-nucleo-modularidad-bibliotecas.md"

      - id: "chap-lso-avz-6"
        title: "Cap 6: Sistemas de archivos y scripts"
        description: "Tipos de sistemas de archivos, journaling, compatibilidad y scripts de administración en bash."
        items:
          - type: "lesson"
            id: "les-lso-avz-6-1"
            slug: "sistemas-archivos-tipos-compatibilidad"
            title: "6.1 Sistemas de archivos: tipos, journaling y compatibilidad"
            duration: "50 min"
            content_file: "cap-6-1-sistemas-archivos-tipos-compatibilidad.md"
          - type: "lesson"
            id: "les-lso-avz-6-2"
            slug: "scripts-administracion-bash"
            title: "6.2 Scripts de administración (bash) y automatización"
            duration: "55 min"
            content_file: "cap-6-2-scripts-administracion-bash.md"

      - id: "chap-eval-lso-avz-c"
        title: "Evaluación de la Sección C"
        description: "Comprobá tus conocimientos sobre arquitecturas, sistemas de archivos y scripts."
        items:
          - type: "quiz"
            id: "quiz-lso-avz-c"
            slug: "cuestionario-arquitecturas-scripts"
            title: "Cuestionario: Arquitecturas, Sistemas de Archivos y Scripts"
            duration: "20 min"
            questions:
              - id: "q-lso-avz-abierto"
                question: "¿Cuál de las siguientes características define mejor a un sistema operativo de código abierto?"
                type: "single_choice"
                options:
                  - "Su código fuente es accesible y modificable por la comunidad"
                  - "Su código es secreto y controlado por una empresa"
                  - "No se puede instalar en más de una máquina"
                  - "Funciona únicamente en teléfonos móviles"
                correct_option: 0
                explanation: "En el software de código abierto el código fuente está disponible para verlo, usarlo y modificarlo, como ocurre con Debian."
              - id: "q-lso-avz-so"
                question: "En GNU/Linux, las bibliotecas compartidas dinámicas suelen identificarse con la extensión .so."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "Las bibliotecas compartidas en Linux usan la extensión .so (shared object), equivalentes a los .dll de Windows."
              - id: "q-lso-avz-script"
                question: "¿Qué es un script de administración?"
                type: "single_choice"
                options:
                  - "Un archivo de texto con comandos que se ejecutan automáticamente para automatizar tareas"
                  - "Un dispositivo de hardware"
                  - "Un formato de imagen"
                  - "Un tipo de tipografía"
                correct_option: 0
                explanation: "Un script agrupa comandos en un archivo ejecutable para automatizar tareas repetitivas de administración del sistema."
