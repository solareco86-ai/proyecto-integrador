id: "opencode-avanzado"
slug: "opencode-avanzado"
title: "OpenCode Avanzado: CI/CD, LLMs Locales y Automatización"
description_short: "Profundizá en OpenCode: LLMs locales con Ollama, modo headless, automatización con GitHub Actions y hooks propios."
description_long: "Este curso avanzado te lleva al siguiente nivel del desarrollo asistido por IA con OpenCode. Aprenderás a configurar y ejecutar modelos de lenguaje locales mediante Ollama para mantener el control total de tus datos, a integrar OpenCode de forma headless en scripts y procesos automatizados, y a construir tuberías de CI/CD completas con GitHub Actions. Además, diseñarás hooks y workflows personalizados (pre-commit, pre-push) y automatizarás la publicación de artefactos y modelos de machine learning, alineando la asistencia por IA con las prácticas profesionales de ingeniería de software. Prerrequisitos recomendados: conocimientos de Git, Docker y conceptos de CI/CD, o haber completado el curso Desarrollo de APIs con FastAPI y Python (fastapi-intermedio)."
duration: "8 horas"
level: "Avanzado"
language: "Español"
price: 0.0
