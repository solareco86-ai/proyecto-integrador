        items:
          - type: "quiz"
            id: "quiz-opencode-avanzado"
            slug: "evaluacion-opencode-avanzado"
            title: "Cuestionario: OpenCode Avanzado"
            duration: "10 min"
            questions:
              - id: "q-av-ollama"
                question: "¿Cuál es la principal ventaja de integrar OpenCode con modelos locales como Ollama?"
                type: "single_choice"
                options:
                  - "Aumentar la latencia de cada respuesta generada"
                  - "Privacidad de los datos y funcionamiento sin conexión"
                  - "Acceso exclusivo a modelos propietarios de pago"
                  - "Eliminar la necesidad de escribir tests"
                correct_option: 1
                explanation: "Los modelos locales se ejecutan en tu propia infraestructura, lo que garantiza que el código y los datos sensibles no salgan del entorno, además de habilitar el trabajo sin conexión."
              - id: "q-av-headless"
                question: "El uso headless de OpenCode permite ejecutarlo de forma no interactiva dentro de scripts y procesos automatizados."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "El modo headless habilita la invocación de OpenCode desde la línea de comandos sin la TUI, ideal para integrarlo en scripts, hooks y tuberías de CI/CD."
              - id: "q-av-actions"
                question: "¿Qué archivo define los flujos de trabajo (workflows) en un repositorio con GitHub Actions?"
                type: "single_choice"
                options:
                  - "package.json"
                  - ".github/workflows/*.yml"
                  - "docker-compose.yml"
                  - "opencode.json"
                correct_option: 1
                explanation: "Los workflows de GitHub Actions se definen como archivos YAML dentro del directorio .github/workflows/, donde se declaran triggers, jobs y steps."
