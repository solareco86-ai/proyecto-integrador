id: "python-datos-fundamentos"
slug: "python-datos-fundamentos"
title: "Python y Entorno para Ciencia de Datos"
description_short: "Introducción práctica a Python, entornos virtuales, Git y análisis de datos con Pandas y NumPy."
description_long: "Este curso es el punto de entrada recomendado del catálogo de DataMaq para estudiantes de Ciencia de Datos e Inteligencia Artificial que necesitan nivelar sus bases antes de avanzar a FastAPI, OpenCode o proyectos aplicados. Aprenderás a manejar la terminal y el control de versiones con Git, a instalar Python y gestionar entornos virtuales con venv, y a programar en Python con listas, diccionarios, funciones y módulos. En la segunda parte trabajarás con el flujo interactivo de Jupyter Notebooks, el análisis de datos con NumPy y Pandas, la visualización con Matplotlib y Seaborn, y las buenas prácticas de código que te preparan para construir APIs. No se requieren conocimientos previos de programación: el curso asume un punto de partida inicial y te acompaña paso a paso."
duration: "20 horas de cursada"
level: "Inicial"
language: "Español"
price: 0.0
