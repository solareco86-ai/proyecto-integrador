      - id: "chap-py-cap-5"
        title: "Evaluación Final"
        description: "Validá tus conocimientos adquiridos en el curso."
        items:
          - type: "quiz"
            id: "quiz-python-fundamentos"
            slug: "evaluacion-python-fundamentos"
            title: "Cuestionario: Python y Entorno para Ciencia de Datos"
            duration: "10 min"
            questions:
              - id: "q-py-venv"
                question: "¿Cuál es el propósito principal de un entorno virtual (venv) en un proyecto de Python?"
                type: "single_choice"
                options:
                  - "Acelerar la ejecución de los scripts de Python"
                  - "Aislar las dependencias del proyecto para evitar conflictos de versiones"
                  - "Compilar el código Python a lenguaje de máquina"
                  - "Subir automáticamente el código a GitHub"
                correct_option: 1
                explanation: "Un entorno virtual aísla los paquetes instalados por proyecto, evitando que versiones distintas de una misma librería entren en conflicto en el sistema."
              - id: "q-py-git"
                question: "El comando git commit guarda los cambios en el historial local del repositorio, mientras que git push los envía al repositorio remoto."
                type: "true_false"
                options:
                  - "Verdadero"
                  - "Falso"
                correct_option: 0
                explanation: "git commit registra los cambios en el historial local y git push publica ese historial en el repositorio remoto, como GitHub."
              - id: "q-py-pandas"
                question: "¿Cuál de las siguientes estructuras de Pandas es la más adecuada para almacenar una tabla de datos con filas y columnas?"
                type: "single_choice"
                options:
                  - "Series"
                  - "DataFrame"
                  - "List"
                  - "Dict"
                correct_option: 1
                explanation: "El DataFrame es la estructura tabular bidimensional de Pandas, ideal para representar datos con filas y columnas en el análisis de datos."
