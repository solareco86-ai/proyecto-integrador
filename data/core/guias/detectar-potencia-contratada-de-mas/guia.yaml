summary: "Verificación en tres pasos, con la factura en la mano, para saber si tu planta reservó capacidad que no usa. Qué margen es razonable dejar y por qué bajar demasiado sale más caro que no bajar nada."
problem: "La potencia contratada se fijó hace años sobre una capacidad instalada que ya no existe, y se sigue pagando todos los meses como cargo fijo, produzca la planta o no."
solution: "Contraste entre la potencia contratada de la factura y la demanda máxima realmente registrada durante una campaña de medición continua, con margen de seguridad dimensionado."
key_takeaways:
  - "El cargo por potencia se paga aunque la planta esté parada: es capacidad reservada, no consumo."
  - "La demanda se mide en ventanas de 15 minutos; un pico instantáneo de tres segundos no define la potencia."
  - "Un margen del 10 al 15 % sobre la demanda máxima registrada es razonable; menos es exponerse a penalidades."
  - "Bajar la potencia sin analizar crecimiento previsto obliga a recontratar hacia arriba, que es más caro y más lento."
