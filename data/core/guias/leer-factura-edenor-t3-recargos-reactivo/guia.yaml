summary: "Recorrido línea por línea de una factura de gran demanda: dónde aparece el consumo reactivo, cómo se calcula el recargo por bajo factor de potencia y qué tres números hay que mirar antes de contratar cualquier obra de corrección."
problem: "El recargo por energía reactiva no figura como una línea llamada 'multa': está distribuido entre los cargos por energía y potencia, y la mayoría de las plantas lo paga durante años sin identificarlo."
