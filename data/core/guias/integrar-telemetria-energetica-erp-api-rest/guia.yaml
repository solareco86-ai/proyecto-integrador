title: "Integrar telemetría energética con el ERP vía API REST: del kWh al costo por producto"
category: "Automatización & Retrofit IoT"
reading_time: "6 min de lectura"
summary: "Cómo llevar el consumo eléctrico medido en planta al sistema de gestión para que aparezca en el costeo, en lugar de quedar como un gasto general indiferenciado que nadie puede atribuir."
problem: "La energía se contabiliza como un gasto fijo mensual del total de la planta, así que ningún producto, línea ni turno carga con su consumo real y no hay forma de justificar una inversión en eficiencia."
solution: "Integración de las variables de telemetría al ERP por API REST, con la energía asignada por centro de costos y correlacionada con producción."
key_takeaways:
  - "Si la energía entra al ERP como un único asiento mensual, ningún análisis de costo por producto va a ser real."
  - "La asignación por centro de costos requiere instrumentar seccionales, no sólo el tablero general."
  - "La correlación necesita que consumo y producción compartan estampa de tiempo y unidad de agregación."
  - "Conviene empezar por los dos o tres centros de costo que concentran el consumo, no por toda la planta."
