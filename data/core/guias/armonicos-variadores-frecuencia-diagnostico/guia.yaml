slug: "armonicos-variadores-frecuencia-diagnostico"
title: "Armónicos en plantas con variadores de frecuencia: cómo se diagnostican y por qué condicionan la corrección de reactivo"
category: "Regulación Eléctrica & Penalidades"
reading_time: "7 min de lectura"
summary: "Los variadores de frecuencia bajan el consumo activo pero inyectan corrientes armónicas en la instalación. Guía de diagnóstico previa a cualquier banco de capacitores, para evitar resonancia y sobretensiones destructivas."
problem: "Instalar compensación de reactivo en una planta con alto contenido armónico sin medirlo antes puede provocar resonancia paralela, sobretensiones y la destrucción del propio equipo de corrección."
solution: "Medición de espectro armónico y THD con analizador Powermeter SmartPlus antes de especificar la obra, y elección del tipo de compensación en función del contenido armónico medido."
key_takeaways:
  - "Un variador de frecuencia es una carga no lineal: mejora el cos φ de desplazamiento pero degrada el factor de potencia total."
  - "El riesgo no es el armónico en sí, sino la resonancia entre la capacidad del banco y la inductancia de la instalación."
  - "El diagnóstico mínimo es THD de tensión y de corriente, más el espectro por orden hasta el armónico 25."
  - "Con THD de corriente elevado, la compensación debe llevar reactancias de rechazo; no es un extra opcional."
