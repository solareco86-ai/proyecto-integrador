content: |
  ## 1. El Dilema del Retrofit IoT: ¿Comprar Máquinas Nuevas o Digitalizar las Existentes?

  Muchas plantas industriales en el conurbano bonaerense operan con prensas, extrusoras, hornos y reactores mecánicamente impecables pero carentes de conectividad moderna.

  Frente a esto, la opción de renovar la maquinaria completa representa una inversión de decenas de miles de dólares inalcanzable para la mayoría de las PyMEs.

  El **Retrofit IoT** resuelve este dilema agregando una capa de sensado e instrumentación digital no invasiva que convierte cualquier máquina analógica en un activo conectado a la Industria 4.0.

  ---

  ## 2. Powermeter Gateway: El Puente Universal de Datos

  El **Powermeter Gateway** es un concentrador multiprotocolo de montaje en riel DIN diseñado para entornos industriales severos:

  * **Puerto RS485 Modbus RTU:** Permite conectar hasta 32 dispositivos en bus (variadores de frecuencia Schneider / WEG / Delta, pirómetros Novus / Autonics, controladores de temperatura y centrales de alarma).
  * **Entradas Analógicas (4-20 mA y 0-10 V):** Lectura directa de transmisores de presión, sensores de nivel por ultrasonido, caudalímetros y termocuplas PT100.
  * **Entradas Digitales de Pulsos:** Conteo de ciclos mecánicos, conteo de piezas y estados de marcha/parada de línea.

  ---

  ## 3. De la Trama Binaria a la Pantalla del Celular

  1. **Captura en Tablero:** El Gateway lee las tramas de los variadores y sensores en planta.
  2. **Enlace Seguro:** Transmite los datos vía Ethernet o Wi-Fi industrial con encriptación TLS.
  3. **Visualización Gráfica:** Los operarios y jefes de planta acceden al dashboard web en tiempo real sin pagar licencias de software privativas ($0 SaaS).

  ---

  ## 4. Integración con el ERP Contable Xubio

  Como servicio complementario, DataMaq programa la conexión directa entre la telemetría del Gateway y el software de gestión contable **Xubio**:

  * **Costeo Directo por Lote:** Imputación automática del costo energético real de cada orden de producción según los kWh medidos en el tablero seccional de la máquina.
  * **Control de Mermas:** Cruce entre los kilos pesados en balanzas conectadas por Modbus y las unidades facturadas en el ERP.
  * **API REST Segura:** Comunicación estándar sin alterar la base de datos de la empresa.
