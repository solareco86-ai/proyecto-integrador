title: "Checklist de auditoría energética en carga para suministros T2 y T3"
category: "Regulación Eléctrica & Penalidades"
reading_time: "6 min de lectura"
summary: "Qué se mide, dónde se instala el equipo, cuánto tiene que durar la campaña y qué entregables debe producir un relevamiento energético para que sirva como especificación técnica de obra."
problem: "Relevamientos de una tarde, con pinza amperométrica y planta parada, que producen un número que no representa el comportamiento real y no sirve para dimensionar nada."
solution: "Campaña de medición continua sobre un ciclo productivo completo con analizador Powermeter SmartPlus, con alcance, puntos de medición y entregables definidos por escrito antes de empezar."
key_takeaways:
  - "Una medición puntual con la planta parada no dice nada: el reactivo y los picos aparecen en carga."
  - "La campaña tiene que cubrir un ciclo productivo completo, incluyendo el fin de semana y los arranques de turno."
  - "El tablero general no alcanza cuando hay que asignar consumo o aislar responsabilidades."
  - "Si el relevamiento no termina en una memoria técnica con curvas registradas, no sirve para licitar la obra."
