content: |
  ## 1. El Nuevo Escenario Regulatorio (Res. ENRE 544/2024)

  A partir de la entrada en vigencia de la **Resolución ENRE 544/2024**, el Ente Nacional Regulador de la Electricidad elevó el umbral reglamentario del factor de potencia de **0,85 a cos φ ≥ 0,95** para todos los usuarios comerciales e industriales categorizados en las tarifas **T2 (Medianas Demandas)** y **T3 (Grandes Demandas en Baja y Media Tensión)**.

  Esta modificación implica que cualquier industria cuyos motores eléctricos, transformadores, compresores o iluminación generen un desfasaje inductivo por debajo de 0,95 sufrirá **recargos mensuales directos sobre el total de la factura de energía**.

  ---

  ## 2. El Riesgo Crítico: Suspensión del Suministro (Artículo 9)

  Más allá del sobrecosto financiero, el aspecto más crítico de la norma radica en su **Artículo 9**:

  > **Artículo 9 (Res. ENRE 544/2024):** Aquellos suministros que registren un factor de potencia inferior a **0,60** (o tangente de fi superior a 1,34) representan una amenaza para la estabilidad de la red de distribución, quedando la distribuidora (**Edenor / Edesur**) facultada para **proceder a la suspensión inmediata del servicio eléctrico**.

  Para una planta productiva en el Parque Industrial de Pilar o Garín, una suspensión de 48 a 72 horas genera pérdidas operativas que multiplican por 10 el costo de cualquier obra de compensación.

  ---

  ## 3. Tabla de Impacto y Penalidades

  | Factor de Potencia (cos φ) | Estado Normativo | Consecuencia en Factura Edenor | Acción Requerida |
  |---|---|---|---|
  | **≥ 0,95** | Cumplimiento Óptimo | Sin penalidades ($0 recargo) | Monitoreo continuo de telemetría |
  | **0,85 a 0,94** | Zona de Penalidad Moderada | Recargo porcentual mensual acumulativo | Medición IoT y compensación fija |
  | **0,60 a 0,84** | Zona de Penalidad Grave | Multas severas (30% a 80% sobre potencia) | Instalación urgente de banco automático |
  | **< 0,60** | **Zona Crítica (Art. 9)** | **Intimación y Riesgo de Corte de Suministro** | **Intervención express en menos de 24/48 hs** |

  ---

  ## 4. Metodología de Solución DataMaq: De la Medición a la Obra

  Corregir el factor de potencia no consiste en "comprar capacitores al azar". Un cálculo incorrecto puede sobrecompensar la red (generando penalidades por reactiva capacitiva en horas valle) o entrar en **resonancia con armónicos (THD)**, quemando placas electrónicas y variadores VFD.

  DataMaq ejecuta un protocolo en 3 etapas:

  1. **Filtro Asíncrono Documental (<3 min):** Auditoría inmediata de la factura en PDF enviada por WhatsApp al `+54 11 5629 7160` para dimensionar el costo de la penalidad mensual.
  2. **Medición en Carga con Powermeter SmartPlus:** Conexión de un analizador inteligente en el Tablero General de Baja Tensión (TGBT) durante un turno completo de producción para medir la curva real de potencia activa (kW), reactiva (kVAR), cos φ instantáneo y armónicos.
  3. **Especificación de Ingeniería & Puesta en Marcha:** Cálculo de las etapas de kVAR necesarias (fijas y automáticas), verificación de inductancias anti-resonancia y acta de entrega llave en mano.

  ---

  ## 5. Retorno de Inversión (Payback)

  * **Tarifa T2 Promedio (PyME Metalúrgica / Textil):** Multa mensual evitada: ~$350.000 a $600.000 ARS. Payback de la solución: **60 a 90 días**.
  * **Tarifa T3 BT (Inyección de Plástico / Papelera):** Multa mensual evitada: ~$1.200.000 a $3.900.000 ARS. Payback de la solución: **30 a 45 días**.
