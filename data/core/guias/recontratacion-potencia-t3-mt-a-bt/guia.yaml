title: "Recontratación de potencia: qué mirar antes de cambiar de categoría tarifaria"
category: "Gestión Tarifaria & Costos"
reading_time: "6 min de lectura"
summary: "El cambio de categoría no es sólo un número de potencia: involucra el punto de medición, la propiedad del transformador y las pérdidas que pasás a asumir. Qué evaluar antes de pedirlo."
problem: "Se compara el cargo por kW entre categorías y se concluye que conviene cambiar, sin considerar la responsabilidad sobre el transformador, las pérdidas ni el costo de la obra de adecuación."
solution: "Análisis integral con la curva de carga medida, el estado de la subestación propia y el costo total de propiedad, no sólo el cuadro tarifario."
key_takeaways:
  - "En media tensión el cargo unitario es menor, pero el cliente asume el transformador, su mantenimiento y sus pérdidas."
  - "Las pérdidas del transformador en vacío se pagan las 24 horas, produzca la planta o no."
  - "El cambio de categoría suele requerir obra de adecuación en el punto de medición: es una inversión, no un trámite."
  - "Con demanda estable y alta el análisis suele cerrar; con demanda baja o intermitente, muchas veces no."
