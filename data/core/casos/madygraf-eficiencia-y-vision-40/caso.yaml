content: |
  ## Contexto e Iniciativa de Reconversión 4.0

  La Cooperativa MadyGraf (ex Donnelley), ubicada en la Zona Norte del GBA, llevó adelante un proceso de reconversión productiva y tecnológica orientado a la sustentabilidad y diversificación hacia la fabricación de bolsas ecológicas de papel.

  Para abordar los costos energéticos y asegurar la eficiencia operativa, se articuló un proyecto de transferencia tecnológica junto al Fondo de Innovación Tecnológica de Buenos Aires (FITBA) y la Universidad Nacional de José C. Paz (UNPAZ).

  ## Despliegue Técnico e Ingesta IoT

  Se instaló un esquema de adquisición de datos en tiempo real mediante dispositivos IoT conectados a los tableros de alimentación de las líneas clave.

  El sistema registra:

  - Consumo activo, reactivo y calidad de potencia por circuito.
  - Detección automática de encendidos y picos de demanda puntual.
  - Ingesta de métricas operativas para el seguimiento del proceso de producción.
  - Integración de control de calidad inteligente para minimizar el descarte en la línea de empaque.

  ## Impacto Industrial y Red de Aprendizaje

  La visibilidad en tiempo real permitió al equipo técnico y de producción reprogramar encendidos de maquinaria pesada, nivelando la curva de carga y evitando sobrecostos tarifarios.

  La experiencia y los resultados obtenidos convirtieron a MadyGraf en una planta de referencia dentro de las Redes de Aprendizaje en Eficiencia Energética impulsadas para PyMEs e industrias recuperadas de la provincia de Buenos Aires.
