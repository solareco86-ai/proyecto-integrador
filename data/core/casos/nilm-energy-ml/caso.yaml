content: |
  ## Contexto Pedagógico

  **energy-ml** es el **caso de estudio oficial** del curso "[Procesamiento de Aprendizaje Automático](https://isftn199.com.ar/cursos/procesamiento-aprendizaje-automatico)" del Instituto Superior de Formación Técnica N° 199 (ISFT N° 199), Tigre, Buenos Aires.

  Los estudiantes usan este proyecto como un **laboratorio vivo** para comprender cómo los conceptos de cada lección se implementan en código real:
  - **Cap 4.2:** Primer servidor FastAPI → `src/infrastructure/fastapi/routes.py` con endpoint `/api/v1/identify-loads`
  - **Cap 5.1:** Matriz de confusión → `src/application/cargas/metricas.py` con cálculo de precisión, recall y F1
  - **Cap 3.1:** Árboles de decisión y Gini → `src/infrastructure/sklearn/clustering.py` con DBSCAN

  ## ¿Qué es NILM?

  **NILM (Non-Intrusive Load Monitoring)** es una técnica que identifica qué electrodomésticos están encendidos analizando solo la corriente total del tablero eléctrico, sin instalar medidores independientes en cada circuito.

  Analogía: Como un cocinero experimentado identifica ingredientes por el aroma, NILM identifica cargas por patrones de consumo.

  ## Arquitectura Limpia: 4 Capas

  ```
  domain/              ← Entidades puras (@dataclass, sin Pydantic/FastAPI)
  application/         ← Casos de uso, DTOs Pydantic, mappers
  infrastructure/      ← FastAPI, sklearn, repositorios CSV
  adapters/            ← Presenters JSON-agnósticos
  ```

  ## Flujo de Datos Completo

  1. **CSV** → Lectura de mediciones (timestamp, voltage, current, power)
  2. **Detección de eventos** → Cambios en potencia (derivada)
  3. **Clustering DBSCAN** → Agrupa eventos por firma (aire, heladera, horno, etc.)
  4. **Evaluación** → Matriz de confusión contra etiquetas conocidas
  5. **JSON Response** → `{"cargas": [...], "metricas": {"f1": 0.96, ...}}`

  ## Mapeo: Lecciones → Código

  | Lección | Archivo en energy-ml |
  |---------|----------------------|
  | **Cap 4.2** FastAPI | `src/infrastructure/fastapi/routes.py` |
  | **Cap 5.1** Matriz confusión | `src/application/cargas/metricas.py` |
  | **Cap 3.1** DBSCAN/Gini | `src/infrastructure/sklearn/clustering.py` |
  | **Cap 5.2** pytest + TDD | `tests/application/cargas/test_identify_use_case.py` |
  | **Cap 5.3** /metrics endpoint | `GET /api/v1/metrics` |

