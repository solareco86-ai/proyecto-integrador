content: |
  ## Contexto e Iniciativa Institucional

  Las Redes de Aprendizaje en Eficiencia Energética constituyen un modelo colaborativo internacional impulsado por la Secretaría de Energía de la Nación y la Cooperación Alemana (GIZ). En la provincia de Buenos Aires, esta metodología se desplegó junto a la Universidad Nacional de José C. Paz (UNPAZ) y el Instituto Provincial de Asociativismo y Cooperativismo (IPAC/IPAP).

  El programa acompañó a empresas industriales recuperadas y PyMEs de proceso continuo —como Unión Papelera Platense (UPP), Textiles Pigüé y MadyGraf— en la implementación de Sistemas de Gestión de la Energía (SGEn) basados en la norma ISO 50001.

  ## Trabajo en Campo e Ingesta IoT

  Como docente, facilitador y consultor técnico del programa, Agustín Bustos intervino directamente en los tableros de distribución de las plantas participantes:

  - **Instalación de Instrumentación IoT:** colocación de analizadores de redes en bornes principales para registrar demanda activa, potencia reactiva y armónicos sin interrumpir la marcha.
  - **Relevamiento Térmico y Electrónico:** inspección termográfica en transformadores, borneras y celdas para identificar puntos calientes y riesgos de avería.
  - **Línea de Base e IDEn:** definición de Indicadores de Desempeño Energético (kWh/tonelada de papel o kWh/kilo de tela) para evaluar la eficiencia real de cada turno.

  ## Resultados e Impacto Industrial

  Las plantas lograron detectar desbalances de fase, picos de demanda durante arranques simultáneos y bancos de capacitores fuera de servicio.

  La combinación del trabajo colaborativo en red con datos duros medidos en campo permitió a los equipos de mantenimiento corregir sobrecostos tarifarios y operar de manera sustentable.
