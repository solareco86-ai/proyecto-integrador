      - "carreras hay"
      - "carreras tienen"
      - "que se estudia"
      - "que puedo estudiar"
      - "oferta academica"
      - "tecnicaturas"
    respuesta: "El ISFT N° 199 ofrece 6 tecnicaturas superiores de 3 años, públicas y gratuitas: Ciencia de Datos e IA, Logística, Higiene y Seguridad en el Trabajo, Administración de Recursos Humanos, Turismo y Hotelería."
    sources:
