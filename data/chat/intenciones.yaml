# Intenciones del chatbot institucional con respuestas y fuentes oficiales.
# Las respuestas que requieren datos institucionales no presentes en data/
# (becas, mesas de examen, correlatividades) derivan a Secretaría (AGENTS.md §7.5).

intenciones:
