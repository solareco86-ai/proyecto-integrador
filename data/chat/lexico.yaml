# Sub-gramática del año de cursada: ordinal + marcador ("primer año") o
# marcador + ordinal ("año 2").
ordinales:
  1: [primero, primer, 1ro, 1er, 1, uno]
  2: [segundo, 2do, 2, dos]
  3: [tercero, tercer, 3ro, 3er, 3, tres]
marcador_anio:
  - año
  - ano
  - anio
