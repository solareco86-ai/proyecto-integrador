# Léxico controlado del dominio institucional — Eje 1.3 (Técnicas de Procesamiento del Habla).
#
# Cada entrada es una forma ya normalizada por el pipeline del Eje 1.2
# (minúsculas, sin tildes, abreviaturas expandidas). Las expresiones de varias
# palabras se reconocen por coincidencia más larga primero; las de una sola
# palabra también se reconocen por su raíz (stem), lo que cubre variantes como
# "materia" / "materias" o "inscribir" / "inscribirme".
#
# Los nombres oficiales de las carreras NO se escriben acá: se leen de
# data/content/carreras.yaml (fuente única de verdad). Esta sección solo agrega
# alias coloquiales asociados al slug oficial de cada carrera.

saludos:
  - hola
  - buenas
  - buen dia
  - buenos dias
  - buenas tardes
  - buenas noches
  - que tal

# Verbos y pronombres de pedido: no aportan intención propia, pero forman
# parte de la consulta y cuentan como palabras reconocidas.
pedidos:
  - quiero
  - quisiera
  - necesito
  - saber
  - consultar
  - consulta
  - informacion
  - puedo
  - podria
  - hay
  - tienen
  - tiene
  - ofrecen
  - son
  - cuales
  - cuantos
  - cuanto
  - que
  - como
  - cual
  - cuando
  - donde
  - instituto
  - isft

