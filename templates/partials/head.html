{% macro head_seo(request, seo_data, brand, page_type='website', robots='index,follow') %}
    <meta charset='UTF-8'>
    <link rel='icon' href='{{ request.url_for('static', path='favicon.svg') }}' type='image/svg+xml'>
    <link rel='manifest' href='{{ request.url_for('static', path='manifest.json') }}'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>{{ seo_data.title }}</title>

    <link rel='preconnect' href='https://fonts.googleapis.com' crossorigin>
    <link rel='dns-prefetch' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link rel='dns-prefetch' href='https://fonts.gstatic.com'>
    <link rel='preconnect' href='https://www.googletagmanager.com' crossorigin>
    <link rel='dns-prefetch' href='https://www.googletagmanager.com'>
    <link rel='preconnect' href='https://www.google-analytics.com' crossorigin>
    <link rel='dns-prefetch' href='https://www.google-analytics.com'>
    <link rel='preconnect' href='https://googleads.g.doubleclick.net' crossorigin>
    <link rel='dns-prefetch' href='https://googleads.g.doubleclick.net'>
    <link rel='preconnect' href='https://www.googleadservices.com' crossorigin>
    <link rel='dns-prefetch' href='https://www.googleadservices.com'>
    <link rel='preconnect' href='https://www.clarity.ms' crossorigin>
    <link rel='dns-prefetch' href='https://www.clarity.ms'>

    <!-- CSS Crítico Inline (Above The Fold) -->
    {% include 'partials/critical_css.html' %}

    <!-- CSS Principal de la Aplicación -->
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/index.css') }}?v={{ static_version() }}">

    <script>
        window.APP_CONFIG = {
            gaId: '{{ config.GOOGLE_ANALYTICS_ID }}',
            googleAdsId: '{{ config.GOOGLE_ADS_ID }}',
            googleAdsConversionId: '{{ config.GOOGLE_ADS_CONVERSION_ID }}',
            googleAdsWhatsappConversionId: '{{ config.GOOGLE_ADS_WHATSAPP_CONVERSION_ID }}',
            clarityId: '{{ config.CLARITY_ID }}',
            contactApiUrl: '{{ request.url_for("submit_contact") }}',
            telemetryApiUrl: '{{ config.TELEMETRY_API_URL }}',
            telemetryWsUrl: '{{ config.TELEMETRY_WS_URL }}',
            debug: '{{ "true" if config.DEBUG else "false" }}' === 'true'
        };
    </script>



    <meta name='description' content='{{ seo_data.description }}'>
    <meta name='robots' content='{{ seo_data.meta_robots or robots }}'>

    <meta property='og:title' content='{{ seo_data.title }}'>
    <meta property='og:description' content='{{ seo_data.description }}'>
    <meta property='og:type' content='{{ page_type }}'>
    <meta property='og:url' content='{{ seo_data.canonical_url }}'>
    <meta property='og:image' content='{{ seo_data.og_image }}'>
    {% if seo_data.og_image_width %}<meta property='og:image:width' content='{{ seo_data.og_image_width }}'>{% endif %}
    {% if seo_data.og_image_height %}<meta property='og:image:height' content='{{ seo_data.og_image_height }}'>{% endif %}
    <meta property='og:site_name' content='{{ seo_data.site_name }}'>
    <meta property='og:locale' content='es_AR'>

    <meta name='twitter:card' content='summary_large_image'>
    <meta name='twitter:title' content='{{ seo_data.title }}'>
    <meta name='twitter:description' content='{{ seo_data.description }}'>
    <meta name='twitter:image' content='{{ seo_data.og_image }}'>

    <link rel='canonical' href='{{ seo_data.canonical_url }}'>
    <link rel='alternate' hreflang='es_AR' href='{{ seo_data.canonical_url }}'>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "additionalType": "https://schema.org/EducationalOrganization",
                "name": "{{ seo_data.site_name }}",
                "url": "{{ seo_data.canonical_url }}",
                "logo": "{{ request.url_for('static', path='favicon.svg') }}",
                "telephone": "+{{ config.WHATSAPP_PHONE }}",
                "email": "{{ brand.contactEmail }}",
                {% if brand.address %}
                "address": {
                    "@type": "PostalAddress",
                    "streetAddress": "{{ brand.address.streetAddress }}",
                    "postalCode": "{{ brand.address.postalCode }}",
                    "addressLocality": "{{ brand.address.addressLocality }}",
                    "addressRegion": "{{ brand.address.addressRegion }}",
                    "addressCountry": "{{ brand.address.addressCountry }}"
                },
                {% endif %}
                {% if brand.geo %}
                "geo": {
                    "@type": "GeoCoordinates",
                    "latitude": {{ brand.geo.lat }},
                    "longitude": {{ brand.geo.lng }}
                },
                {% endif %}
                {% if brand.openingHours %}
                "openingHours": "{{ brand.openingHours }}",
                {% endif %}
                {% if brand.sameAs %}"sameAs": [{% for url in brand.sameAs %}"{{ url }}"{% if not loop.last %},{% endif %}{% endfor %}],{% endif %}
                "knowsAbout": [
                    "Educación Superior Técnica Pública",
                    "Ciencia de Datos e Inteligencia Artificial",
                    "Mecatrónica y Automatización Industrial",
                    "Logística y Cadena de Suministro",
                    "Higiene y Seguridad en el Trabajo",
                    "Administración de Recursos Humanos",
                    "Servicios Gastronómicos y Turismo",
                    "Programación en Python y Machine Learning",
                    "Robótica y Controladores Lógicos Programables (PLC)",
                    "Dirección General de Cultura y Educación (DGCyE)"
                ],
                "areaServed": [
                    {"@type": "AdministrativeArea", "name": "Tigre"},
                    {"@type": "AdministrativeArea", "name": "El Talar"},
                    {"@type": "AdministrativeArea", "name": "General Pacheco"},
                    {"@type": "AdministrativeArea", "name": "Don Torcuato"},
                    {"@type": "AdministrativeArea", "name": "Benavídez"},
                    {"@type": "AdministrativeArea", "name": "San Fernando"},
                    {"@type": "AdministrativeArea", "name": "Escobar"},
                    {"@type": "AdministrativeArea", "name": "Garín"},
                    {"@type": "AdministrativeArea", "name": "Pilar"},
                    {"@type": "AdministrativeArea", "name": "Zona Norte GBA"}
                ],
                "hasOfferCatalog": {
                    "@type": "OfferCatalog",
                    "name": "Tecnicaturas Superiores Oficiales del ISFT N° 199",
                    "itemListElement": [
                        {
                            "@type": "Offer",
                            "itemOffered": {
                                "@type": "Course",
                                "name": "Tecnicatura Superior en Ciencia de Datos e Inteligencia Artificial",
                                "description": "Carrera oficial de 3 años en Python, Machine Learning, Deep Learning, SQL y Big Data. Turno vespertino, 100% gratuita."
                            }
                        },
                        {
                            "@type": "Offer",
                            "itemOffered": {
                                "@type": "Course",
                                "name": "Tecnicatura Superior en Mecatrónica",
                                "description": "Carrera oficial de 3 años en automatización industrial, robótica, PLCs, neumática y control. Turno vespertino, 100% gratuita."
                            }
                        },
                        {
                            "@type": "Offer",
                            "itemOffered": {
                                "@type": "Course",
                                "name": "Tecnicatura Superior en Logística",
                                "description": "Carrera oficial de 3 años en gestión de la cadena de suministro, almacenamiento, ruteo y comercio exterior. Turno vespertino, 100% gratuita."
                            }
                        },
                        {
                            "@type": "Offer",
                            "itemOffered": {
                                "@type": "Course",
                                "name": "Tecnicatura Superior en Higiene y Seguridad en el Trabajo",
                                "description": "Carrera oficial de 3 años con matrícula habilitante en prevención de riesgos laborales y normativa SRT. Turno vespertino, 100% gratuita."
                            }
                        },
                        {
                            "@type": "Offer",
                            "itemOffered": {
                                "@type": "Course",
                                "name": "Tecnicatura Superior en Administración de Recursos Humanos",
                                "description": "Carrera oficial de 3 años en gestión del talento, relaciones laborales y liquidación de haberes. Turno vespertino, 100% gratuita."
                            }
                        },
                        {
                            "@type": "Offer",
                            "itemOffered": {
                                "@type": "Course",
                                "name": "Tecnicatura Superior en Servicios Gastronómicos y Turismo",
                                "description": "Carrera oficial de 3 años en planificación turística, gestión hotelera y desarrollo del Delta de Tigre. Turno vespertino, 100% gratuita."
                            }
                        }
                    ]
                },
                "contactPoint": {
                    "@type": "ContactPoint",
                    "contactType": "Secretaría Académica e Informes de Ingreso",
                    "telephone": "+{{ config.WHATSAPP_PHONE }}",
                    "email": "{{ brand.contactEmail }}",
                    "areaServed": "AR",
                    "availableLanguage": "Spanish"
                }
            },
            {
                "@type": "WebPage",
                "name": "{{ seo_data.title }}",
                "description": "{{ seo_data.description }}",
                "url": "{{ seo_data.canonical_url }}"
            }
        ]
    }
    </script>
{% endmacro %}
