{# Interruptor de tema claro/oscuro. Los dos símbolos quedan siempre visibles y
   el carro se desplaza al activo, de modo que se lee el estado actual sin
   depender del color. El texto accesible va en aria-label, no en pantalla. #}
{% macro conmutador_tema() %}
<button class="conmutador" type="button" role="switch" aria-checked="false"
        aria-label="Cambiar entre tema claro y oscuro" data-conmutador>
    <span class="conmutador__carro" aria-hidden="true"></span>
    <span class="conmutador__icono conmutador__icono--sol" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
    </span>
    <span class="conmutador__icono conmutador__icono--luna" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/>
        </svg>
    </span>
</button>
{% endmacro %}
