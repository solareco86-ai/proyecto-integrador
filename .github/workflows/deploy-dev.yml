name: CD Deploy Dev
on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "data/**"
      - "static/**"
      - "templates/**"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-dev.yml"
      - "scripts/deploy-server.sh"
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy dev al VPS
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          log-public-key: false
      - name: Add known hosts
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
      - name: Deploy dev to VPS
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_REMOTE_DIR: '/var/www/proyecto-integrador-dev'
          DEPLOY_SERVICE_NAME: 'isftn199-dev.service'
          DEPLOY_APP_PORT: "8004"
          DEPLOY_BRANCH: 'develop'
          DEPLOY_SKIP_PURGE: 'true'
        run: ./scripts/deploy-server.sh
