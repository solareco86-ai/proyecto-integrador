# Vhost nginx del entorno dev (https://dev.isftn199.com.ar).
#
# Cloudflare opera en modo Flexible: llega al origen por HTTP:80 y marca la
# petición original con X-Forwarded-Proto. Por eso solo se define el bloque :80
# (no hace falta certificado en el origen). Si la zona pasara a modo Full, habría
# que ampliar el certificado (certbot --expand) y agregar el bloque ssl en
# 127.0.0.1:9443 como en isftn199.com.ar.conf.
server {
    listen 80;
    listen [::]:80;
    server_name dev.isftn199.com.ar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Opcional (cierra el acceso directo por IP saltándose Cloudflare Access):
    # permitir solo rangos de Cloudflare (https://www.cloudflare.com/ips/) y
    # denegar el resto, p. ej. con `allow <rango>;` ... `deny all;`.

    location ^~ /. {
        return 403;
    }

    location / {
        # Evita el bucle de redirecciones con Cloudflare Flexible: solo se
        # redirige a clientes HTTP genuinos.
        if ($http_x_forwarded_proto != "https") {
            return 301 https://dev.isftn199.com.ar$request_uri;
        }
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Strict-Transport-Security;
        # El entorno dev nunca debe indexarse.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_read_timeout 60s;
    }
}
