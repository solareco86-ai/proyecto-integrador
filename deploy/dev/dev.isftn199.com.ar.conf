# Vhost nginx del entorno dev (https://dev.isftn199.com.ar).
#
# Cloudflare opera en modo Flexible: llega al origen por HTTP:80 y marca la
# petición original con X-Forwarded-Proto. Por eso solo se define el bloque :80
# (no hace falta certificado en el origen). Si la zona pasara a modo Full, habría
# que ampliar el certificado (certbot --expand) y agregar el bloque ssl en
# 127.0.0.1:9443 como en isftn199.com.ar.conf.
server {
    listen 80;
    listen [::]:80;
    server_name dev.isftn199.com.ar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Guardia de origen: solo se aceptan conexiones provenientes de Cloudflare
    # (y localhost para las verificaciones). Los rangos viven en
    # /etc/nginx/snippets/cloudflare-allow.conf (generado por provision-dev.sh);
    # el `include` está dentro de `location /`.

    location ^~ /. {
        return 403;
    }

    location / {
        # Guardia temporal de acceso (reemplazar por Cloudflare Access cuando
        # el rol de cuenta lo permita): solo conexiones de Cloudflare/localhost
        # y con Basic Auth.
        include /etc/nginx/snippets/cloudflare-allow.conf;

        auth_basic "Entorno de desarrollo";
        auth_basic_user_file /etc/nginx/.htpasswd-dev;

        # Evita el bucle de redirecciones con Cloudflare Flexible: solo se
        # redirige a clientes HTTP genuinos.
        if ($http_x_forwarded_proto != "https") {
            return 301 https://dev.isftn199.com.ar$request_uri;
        }
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real del cliente (Cloudflare la entrega en CF-Connecting-IP).
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Strict-Transport-Security;
        # El entorno dev nunca debe indexarse.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_read_timeout 60s;
    }
}
